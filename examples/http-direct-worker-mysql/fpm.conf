; Task 074 example. One worker, on purpose: every concurrency number this
; example produces has to come from inside a single process, or it proves
; nothing that plain FPM does not already do.
[global]
error_log = /proc/self/fd/2
daemonize = no

[worker]
listen = 0.0.0.0:8080
pool.type = http-direct
pool.executor = worker
; The master binds the port as root and the child runs as nobody.
user = nobody
group = nogroup
pm = static
pm.max_children = 1
chdir = /app/app
http.front_controller = /app.php
http.read_timeout = 15000
http.max_body = 1M
; The worker reads MYSQL_* from the container environment; FPM clears it by
; default, which would leave the application connecting to 127.0.0.1.
clear_env = no
catch_workers_output = yes
; Required by this executor: one PHP request spans the worker's whole life, so
; a non-zero limit would kill a healthy worker rather than a slow request.
php_admin_value[max_execution_time] = 0
php_admin_value[display_errors] = 0
