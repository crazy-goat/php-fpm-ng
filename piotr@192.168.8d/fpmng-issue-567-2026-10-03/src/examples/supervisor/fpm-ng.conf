; Tier 2: pool.type = supervisor alone. restart_delay is kept at 1s (rather
; than the larger production-sane default) so this example's forced-exit
; verification (README.md) doesn't need to wait through a long backoff.

[global]
error_log = /dev/stderr
daemonize = no
; >= supervisor.stop_timeout below, or the master's own SIGTERM escalation
; (e.g. `docker stop`) kills this pool's child before stop_timeout gets a
; chance to -- php-fpm-ng warns about exactly this if left unset.
process_control_timeout = 15s

[worker]
pool.type = supervisor
supervisor.script = /www/worker.php
supervisor.processes = 1
supervisor.restart = always
supervisor.restart_delay = 1
