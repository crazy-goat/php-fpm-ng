; Tier 2: pool.type = http alone -- TLS, a static file, and a PHP request.
; See examples/http/README.md for how to generate the certificate and for
; the curl commands that verify each of the three.

[global]
error_log = /dev/stderr
daemonize = no

[app]
pool.type = http
listen = 127.0.0.1:9000
http.listen = 0.0.0.0:8443
pm = static
pm.max_children = 2
chdir = /www
http.static = yes
http.tls_cert = /certs/fullchain.pem
http.tls_key = /certs/privkey.pem
