; Tier 2: pool.type = status alone -- paired with one [app] pool so /status
; and /metrics have something real to report (a status pool with nothing
; else running would only prove the endpoints answer, not that they reflect
; state). See README.md for the curl sequence that proves both.

[global]
error_log = /dev/stderr
daemonize = no

[gw]
pool.type = gateway
listen = 0.0.0.0:8080
chdir = /www
http.route[app] = /

[app]
pool.type = fastcgi
listen = 127.0.0.1:9000
pm = static
pm.max_children = 2
chdir = /www

; Own HTTP port, raw -- not the gateway, no PHP. NOTE: pool.type = status was
; removed in issue #278; this stale leftover should be migrated to
; operator.status_path/operator.metrics_path on a real pool. Left for that
; issue rather than rewritten here (issue #388 is about pool.type = http).
[metrics]
pool.type = status
listen = 0.0.0.0:8081
