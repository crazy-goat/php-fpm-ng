server {
	# HTTP/1.1 on purpose: no `http2`. ReactPHP's client speaks HTTP/1.1, and
	# an h2 origin would silently move the framing under test.
	listen 443 ssl;
	server_name origin;

	ssl_certificate /etc/nginx/tls/origin.crt;
	ssl_certificate_key /etc/nginx/tls/origin.key;

	root /usr/share/nginx/html;

	location = /health {
		access_log off;
	}

	location = /slow {
		# 1 MiB at 1 MiB/s, throttled from the first byte
		# (limit_rate_after defaults to 0), so the request takes about a second
		# and the client has to come back for more roughly 16 times at its
		# 64 KiB chunk size. This is the whole reason the origin exists.
		limit_rate 1m;
		alias /usr/share/nginx/html/slow.bin;
	}

	location = /burst {
		# The same payload with no rate limit: nginx sends as fast as the
		# socket takes it, which is what the /strand probe needs — a client
		# reading 1 KiB per event cannot keep up, so if plaintext can be
		# stranded above the descriptor, this is where it happens.
		alias /usr/share/nginx/html/slow.bin;
	}

	location = /small {
		# 8 KiB, unthrottled, and nginx keeps the connection open afterwards.
		# This is the payload for the only case that can actually strand
		# plaintext above the descriptor: small enough that the kernel receive
		# buffer is empty after the first read, on a connection that sends no
		# FIN to make the descriptor readable again. See the /strand route.
		alias /usr/share/nginx/html/small.bin;
	}
}
