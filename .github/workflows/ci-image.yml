name: ci-image

# Builds the image that build-matrix.yml runs its jobs in. Kept separate and
# on a GitHub-hosted runner on purpose: the self-hosted runner consumes this
# image, so building it there would be a chicken-and-egg on a cold machine.
#
# Only fires when the Dockerfile actually changes, so a normal PR does not pay
# for an image build.
on:
  push:
    branches: [main]
    paths:
      - .github/docker/ci.Dockerfile
      - .github/workflows/ci-image.yml
  pull_request:
    paths:
      - .github/docker/ci.Dockerfile
      - .github/workflows/ci-image.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # On a pull_request the image is built but not pushed: a PR from a fork
      # has a read-only GITHUB_TOKEN, and a PR that breaks the Dockerfile
      # should fail here rather than after publishing a broken :latest.
      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: .github/docker
          file: .github/docker/ci.Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/crazy-goat/php-fpm-ng-ci:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
