name: build

# Task 002: prove the tree still builds and our php-src patches still apply.
# See task 002 (done; docs/task-archive.md). The dynamic build remains a single cell
# rather than the full ZTS x session x TLS matrix. The static musl build is
# covered separately below.
#
# Runs on pull_request only (not on every push): a full php-src build is slow
# on GitHub-hosted runners, and only a PR is a candidate for merging into main.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      php_src_ref:
        description: "php-src commit/tag to build against (overrides the pinned default)"
        required: false
        default: ""
      runner:
        description: "where to run: the self-hosted poligon runners, or GitHub-hosted as a fallback when poligon is offline"
        required: false
        type: choice
        default: self-hosted
        options:
          - self-hosted
          - ubuntu-latest

# Every push to a PR branch restarts the whole 13-job matrix; without this the
# superseded run keeps burning minutes to completion.
#
# Every job below except static-musl runs in ghcr.io/crazy-goat/php-fpm-ng-ci
# (built by ci-image.yml from .github/docker/ci.Dockerfile), which is why none
# of them apt-get anything any more. The repeated container: block is
# unavoidable -- GitHub Actions does not expand YAML anchors. Its /ccache
# volume is the self-hosted runner's own disk, so the compiler cache survives
# between runs without being tarred to GitHub's cache service; on a
# GitHub-hosted fallback run that path is empty and ccache starts cold, which
# is what the hosted runner did anyway.
#
# static-musl is the exception: it drives `docker run` with host bind mounts,
# and -v paths are resolved by the host daemon, so a containerised copy of it
# would mount empty directories. It runs on poligon-host, a runner instance
# with its own _work -- kept away from the root-owned workspaces the container
# jobs leave behind.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned by tag, not branch (docs/NOTES.md:2760: "php-src pinned by
  # tag, not branch"). Bumping this is a deliberate version bump, not an automatic
  # moving target — see docs/NOTES.md:2748-2755 on what a patch vs. minor bump
  # requires.
  PHP_SRC_REPO: https://github.com/php/php-src.git
  PHP_SRC_REF: ${{ github.event.inputs.php_src_ref || 'php-8.5.9' }}

jobs:
  # Task 014: the comment-content contract in workflow.md stays linked from the
  # contributor entry points. Fast — checkout only.
  comment-content-rule:
    runs-on: ${{ github.event.inputs.runner == 'ubuntu-latest' && 'ubuntu-latest' || 'fpmng' }}
    container:
      image: ghcr.io/crazy-goat/php-fpm-ng-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      volumes:
        - /opt/gh-runner/cache/ccache:/ccache
      # ubuntu-latest ran jobs unprivileged and the suite depends on it: as
      # root php-fpm refuses to start, so the fpmng suite reports PASS=0 with
      # 47 skips and still looks green. uid 1001 is gh-runner here and the
      # runner user on GitHub-hosted images, so it owns the workspace either way.
      options: --user 1001:1001
    steps:
      - uses: actions/checkout@v7
      - name: verify comment-content rule links (task 014)
        run: ./build/test-comment-content-rule.sh

  # Issue #95: the fpmng runner's fpmng-*.phpt glob is checked against the tests
  # this repo owns, so a new test file cannot be silently unreachable. Hermetic
  # -- no build, no binary; the runner stops at its own preflight.
  fpmng-phpt-coverage:
    runs-on: ${{ github.event.inputs.runner == 'ubuntu-latest' && 'ubuntu-latest' || 'fpmng' }}
    container:
      image: ghcr.io/crazy-goat/php-fpm-ng-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      volumes:
        - /opt/gh-runner/cache/ccache:/ccache
      # ubuntu-latest ran jobs unprivileged and the suite depends on it: as
      # root php-fpm refuses to start, so the fpmng suite reports PASS=0 with
      # 47 skips and still looks green. uid 1001 is gh-runner here and the
      # runner user on GitHub-hosted images, so it owns the workspace either way.
      options: --user 1001:1001
    steps:
      - uses: actions/checkout@v7
      - name: verify fpmng .phpt coverage check (issue #95)
        run: ./build/test-fpmng-phpt-coverage.sh

  # Fast, cheap: proves patches/*.patch still apply to the pinned php-src
  # revision. build/prepare.sh already exits 1 and prints "ERROR: patch does
  # not apply..." on a genuine failure (build/prepare.sh:144) — this job
  # just needs to run it and let that exit code fail the job.
  patches:
    runs-on: ${{ github.event.inputs.runner == 'ubuntu-latest' && 'ubuntu-latest' || 'fpmng' }}
    container:
      image: ghcr.io/crazy-goat/php-fpm-ng-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      volumes:
        - /opt/gh-runner/cache/ccache:/ccache
      # ubuntu-latest ran jobs unprivileged and the suite depends on it: as
      # root php-fpm refuses to start, so the fpmng suite reports PASS=0 with
      # 47 skips and still looks green. uid 1001 is gh-runner here and the
      # runner user on GitHub-hosted images, so it owns the workspace either way.
      options: --user 1001:1001
    steps:
      - uses: actions/checkout@v7
      - name: clone pinned php-src
        run: |
          git init php-src
          git -C php-src fetch --depth 1 "$PHP_SRC_REPO" "$PHP_SRC_REF"
          git -C php-src checkout FETCH_HEAD
      - name: apply patches (build/prepare.sh)
        run: ./build/prepare.sh "$PWD/php-src"

  # Deliberately a single cell for now (non-ZTS, session static, TLS on),
  # not the full ZTS x session x TLS matrix from task 002 (done; docs/task-archive.md).
  # That matrix remains release-time work — see the task file's acceptance
  # criteria 3-4. Re-add strategy.matrix (zts/session/tls) before the first
  # release.
  build:
    needs: patches
    runs-on: ${{ github.event.inputs.runner == 'ubuntu-latest' && 'ubuntu-latest' || 'fpmng' }}
    container:
      image: ghcr.io/crazy-goat/php-fpm-ng-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      volumes:
        - /opt/gh-runner/cache/ccache:/ccache
      # ubuntu-latest ran jobs unprivileged and the suite depends on it: as
      # root php-fpm refuses to start, so the fpmng suite reports PASS=0 with
      # 47 skips and still looks green. uid 1001 is gh-runner here and the
      # runner user on GitHub-hosted images, so it owns the workspace either way.
      options: --user 1001:1001
    steps:
      - uses: actions/checkout@v7

      - name: clone pinned php-src
        run: |
          git init php-src
          git -C php-src fetch --depth 1 "$PHP_SRC_REPO" "$PHP_SRC_REF"
          git -C php-src checkout FETCH_HEAD

      - name: prepare sapi/fpmng in php-src
        run: ./build/prepare.sh "$PWD/php-src"

      - name: buildconf --force
        working-directory: php-src
        run: ./buildconf --force

      - name: configure
        working-directory: php-src
        env:
          CC: ccache gcc
          CXX: ccache g++
        run: |
          # --with-openssl: the C-level HAVE_FPM_HTTP_TLS (gateway TLS termination)
          # comes from libssl-dev alone, but the CLI php built here also needs
          # ext/openssl itself -- our own .phpt tests for TLS features (task 039's
          # fpmng-http-tls-chain.phpt, and more to come for 040/041/042) drive the
          # gateway over a real TLS handshake via PHP's ssl:// stream wrapper and
          # openssl_x509_parse(), both of which live in ext/openssl, not in core.
          # Without this flag those tests silently SKIP ("requires the openssl
          # extension") instead of running -- caught on task 039's first CI run.
          ./configure --disable-all --enable-fpmng --enable-session --with-openssl \
            2>&1 | tee ../configure.log

      - name: build
        working-directory: php-src
        run: make -j"$(nproc)" fpmng cli 2>&1 | tee ../make.log

      # Issue #111: the build is warning-free in the files we ship, and stays
      # that way. -Werror is not available here -- this compiles all of
      # php-src, and upstream's warnings (Zend/zend_ini_scanner.l,
      # ext/json/json_scanner.re: 7 of the 13 seen on 2026-09-09) are not ours
      # to fix. The gate therefore filters the log by `git ls-files` on this
      # repo rather than by path: build/prepare.sh copies all of upstream's
      # sapi/fpm/ into sapi/fpmng/ before overlaying ours, so 20 of the 57 .c
      # files under sapi/fpmng/fpm/ in a prepared tree are upstream's and a
      # path prefix would claim them. See build/check-owned-warnings.sh.
      #
      # $PWD is the workspace root here (no working-directory), which is where
      # the build step's `tee ../make.log` lands. The script exits 2 -- not 0
      # -- if that log turns out to contain no compile of an owned file, so
      # moving either path cannot silently reduce this gate to a no-op.
      - name: no compiler warnings in our own sources (issue #111)
        run: |
          chmod +x build/check-owned-warnings.sh
          ./build/check-owned-warnings.sh "$PWD/make.log"

      - name: verify the binary that got built
        working-directory: php-src
        run: |
          test -x sapi/fpmng/php-fpm-ng
          file sapi/fpmng/php-fpm-ng
          strings sapi/fpmng/php-fpm-ng | grep -q 'X-Powered-By: PHP' || true
          sapi/fpmng/php-fpm-ng -v

      - name: stage artifact
        # A single top-level path, not a multi-entry `path:` list: with more
        # than one path, upload-artifact strips only their *common* ancestor,
        # which is sapi/ here (php-fpm-ng and tests live under sapi/fpmng,
        # cli's php lives under sapi/cli) — not the php-src/sapi/... layout
        # the phpt job expects. Staging a flat, single-root directory avoids
        # depending on that ancestor computation at all.
        run: |
          mkdir -p stage/bin stage/prepared/sapi/fpmng stage/prepared/ext/standard/tests/misc
          cp php-src/sapi/fpmng/php-fpm-ng stage/bin/
          cp php-src/sapi/cli/php stage/bin/
          cp -r php-src/sapi/fpmng/tests stage/prepared/sapi/fpmng/tests
          # fpmng-acme-state.phpt (task 044) requires ../acme/state.php relative to
          # the test itself -- stage that source alongside tests/, the same
          # way tests/ itself is staged, or the require fails on this job's
          # copy even though it works from a full build/prepare.sh tree.
          cp -r php-src/sapi/fpmng/acme stage/prepared/sapi/fpmng/acme
          # run-fpm-phpt.sh (build/run-fpm-phpt.sh:88) requires run-tests.php
          # directly below the "prepared php-src" path it's given.
          cp php-src/run-tests.php stage/prepared/
          # gh12621.phpt reads __DIR__/../../../ext/standard/tests/misc/browscap.ini
          # (a source-tree fixture, not a build product); without it the test
          # fails on a nonexistent browscap path rather than exercising fpmng.
          cp php-src/ext/standard/tests/misc/browscap.ini stage/prepared/ext/standard/tests/misc/

      - name: upload build (for the phpt job)
        uses: actions/upload-artifact@v7
        with:
          name: fpmng-canonical-build
          path: stage
          retention-days: 3

  # Task 001 landed the copied upstream FPM .phpt suite and its runner
  # (build/run-fpm-phpt.sh); wire it into CI against the canonical build cell.
  phpt:
    needs: build
    runs-on: ${{ github.event.inputs.runner == 'ubuntu-latest' && 'ubuntu-latest' || 'fpmng' }}
    container:
      image: ghcr.io/crazy-goat/php-fpm-ng-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      volumes:
        - /opt/gh-runner/cache/ccache:/ccache
      # ubuntu-latest ran jobs unprivileged and the suite depends on it: as
      # root php-fpm refuses to start, so the fpmng suite reports PASS=0 with
      # 47 skips and still looks green. uid 1001 is gh-runner here and the
      # runner user on GitHub-hosted images, so it owns the workspace either way.
      options: --user 1001:1001
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: fpmng-canonical-build
          path: build-out
      - name: run the upstream FPM .phpt suite against php-fpm-ng
        run: |
          chmod +x build-out/bin/php-fpm-ng build-out/bin/php
          TEST_PHP_EXECUTABLE="$PWD/build-out/bin/php" \
          TEST_PHP_FPM_EXECUTABLE="$PWD/build-out/bin/php-fpm-ng" \
          ./build/run-fpm-phpt.sh "$PWD/build-out/prepared" "$PWD/phpt-results"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: phpt-results
          path: phpt-results

  # Task 003: regression tests for pool.type, pool.executor, and request-less
  # pool types. Fiber cases skip on the canonical build (--enable-fpmng-fiber is
  # off by default); cron may take up to one minute.
  fpmng-phpt:
    needs: build
    runs-on: ${{ github.event.inputs.runner == 'ubuntu-latest' && 'ubuntu-latest' || 'fpmng' }}
    container:
      image: ghcr.io/crazy-goat/php-fpm-ng-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      volumes:
        - /opt/gh-runner/cache/ccache:/ccache
      # ubuntu-latest ran jobs unprivileged and the suite depends on it: as
      # root php-fpm refuses to start, so the fpmng suite reports PASS=0 with
      # 47 skips and still looks green. uid 1001 is gh-runner here and the
      # runner user on GitHub-hosted images, so it owns the workspace either way.
      options: --user 1001:1001
    steps:
      - uses: actions/checkout@v7
      # Issue #105: the locale leg of fpmng-http-direct-request-parity.phpt is
      # only discriminating under a Turkish locale -- toupper('i') returns 'i'
      # there, which is what used to corrupt the HTTP_* CGI keys. The runner
      # image carries C, C.utf8 and POSIX only, where even the pre-fix mapping
      # is correct, so without this the check would pass on a reverted fix. The
      # test names the locale it actually got on its own output line, so a run
      # where this step stopped working does not look the same as a real one.
      # The locale is generated in .github/docker/ci.Dockerfile; this step is
      # the assertion that the image still carries it.
      - name: assert tr_TR.UTF-8 is present (issue #105)
        run: locale -a | grep -i tr_TR
      - uses: actions/download-artifact@v8
        with:
          name: fpmng-canonical-build
          path: build-out
      - name: run fpmng-owned .phpt tests (task 003)
        run: |
          chmod +x build-out/bin/php-fpm-ng build-out/bin/php build/run-fpmng-phpt.sh
          TEST_PHP_EXECUTABLE="$PWD/build-out/bin/php" \
          TEST_PHP_FPM_EXECUTABLE="$PWD/build-out/bin/php-fpm-ng" \
          TEST_FPM_TIMEOUT=120 \
          ./build/run-fpmng-phpt.sh "$PWD/build-out/prepared" "$PWD/fpmng-phpt-results"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fpmng-phpt-results
          path: fpmng-phpt-results

  # Task 076 acceptance criterion ("the test is reachable from CI on at least
  # one job that has opcache, or... gains one; say which was done"): NO new
  # job was added. `ext/opcache/config.m4` calls
  # `PHP_NEW_EXTENSION([opcache], ..., [yes])` unconditionally -- there is no
  # `PHP_ARG_ENABLE([opcache])` guarding it at all in this php-src pin
  # ($PHP_SRC_REF) -- so opcache is compiled into every fpmng build regardless
  # of configure flags, `--enable-opcache`/`--disable-all` included, and
  # `opcache.enable` defaults to On. Measured directly: a from-scratch tree
  # configured with the exact `build` job's configure flags above (no opcache
  # flag at all) reports `Zend OPcache` loaded and `opcache.enable => On` via
  # `php -m`/`php -i`, and reproduces the task-076 SIGSEGV pre-fix. So the
  # existing `build` + `fpmng-phpt` cell above already has opcache active and
  # already runs every fpmng-*.phpt file, including the new
  # fpmng-http-direct-worker-opcache.phpt -- a second, --enable-opcache cell
  # would have built and run the identical thing. `static-musl` also has
  # opcache in (build/static-full.sh) but only smoke-tests a scratch
  # container, never the .phpt suite, so it doesn't cover this either way.

  # Task 013: clang-tidy over our C sources only (never a prepared php-src
  # tree's mixed upstream copies). It landed non-blocking on purpose -- a red
  # build on day one for pre-existing findings teaches people to ignore the
  # job. That backlog is now empty: issue #107 fixed the one real finding
  # (clang-analyzer-unix.Malloc in fpm_http.c) and issue #111 the remaining
  # two nits, so on 2026-09-09 `continue-on-error` was dropped and this job
  # became a required check. See docs/c-style.md for the enabled/disabled
  # check contract.
  #
  # Caveat, accepted knowingly, and narrowed since this job moved into
  # .github/docker/ci.Dockerfile: clang-tidy is whatever version that image's
  # base gives (LLVM 18.1.3 on ubuntu 24.04 today), so a new check can still
  # turn this job red without any change to our C sources. The fix then is a
  # decision about that check -- silence it in .clang-tidy with a reason, or
  # fix the code -- not restoring continue-on-error.
  #
  # Pinning the LLVM version was originally rejected as trading a rare, loud
  # break for a permanently stale checker. Pinning the base image is the same
  # trade only in part: the checker does go stale, but it moves on a reviewed
  # Dockerfile diff instead of on GitHub's runner-image schedule, so the break
  # lands in a PR that is already about the toolchain rather than on an
  # unrelated one.
  lint:
    runs-on: ${{ github.event.inputs.runner == 'ubuntu-latest' && 'ubuntu-latest' || 'fpmng' }}
    container:
      image: ghcr.io/crazy-goat/php-fpm-ng-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      volumes:
        - /opt/gh-runner/cache/ccache:/ccache
      # ubuntu-latest ran jobs unprivileged and the suite depends on it: as
      # root php-fpm refuses to start, so the fpmng suite reports PASS=0 with
      # 47 skips and still looks green. uid 1001 is gh-runner here and the
      # runner user on GitHub-hosted images, so it owns the workspace either way.
      options: --user 1001:1001
    steps:
      - uses: actions/checkout@v7

      - name: clone pinned php-src
        run: |
          git init php-src
          git -C php-src fetch --depth 1 "$PHP_SRC_REPO" "$PHP_SRC_REF"
          git -C php-src checkout FETCH_HEAD

      - name: prepare sapi/fpmng in php-src
        run: ./build/prepare.sh "$PWD/php-src"

      - name: buildconf + configure (headers only; no make)
        working-directory: php-src
        run: |
          ./buildconf --force
          ./configure --disable-all --enable-fpmng --enable-session --with-openssl \
            2>&1 | tee ../configure-lint.log

      - name: clang-tidy report (our files only)
        run: |
          chmod +x build/lint-c.sh
          ./build/lint-c.sh "$PWD/php-src" 2>&1 | tee lint-c-report.txt

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lint-c-report
          path: lint-c-report.txt
          retention-days: 14

  # Task 004: prove that the shipped SAPI, not the historical php-src HTTP POC,
  # links statically on musl and serves HTTP when it is the only executable in
  # a scratch image.
  static-musl:
    runs-on: ${{ github.event.inputs.runner == 'ubuntu-latest' && 'ubuntu-latest' || 'poligon-host' }}
    steps:
      # The Alpine build below writes into the workspace as root, and the
      # runner user cannot unlink that afterwards -- the next job on this
      # instance would die in actions/checkout with EACCES. Reclaim first,
      # from a container, since chowning a root-owned file is exactly what
      # the unprivileged runner cannot do. Same step as in ci-image.yml,
      # which shares this instance.
      - name: reclaim the workspace from root-owned build output
        run: |
          docker run --rm -v "${{ github.workspace }}:/w" alpine:3.22 \
            chown -R "$(id -u):$(id -g)" /w

      - uses: actions/checkout@v7
      - name: clone pinned php-src
        run: |
          git init php-src
          git -C php-src fetch --depth 1 "$PHP_SRC_REPO" "$PHP_SRC_REF"
          git -C php-src checkout FETCH_HEAD
      - name: prepare sapi/fpmng in php-src
        run: ./build/prepare.sh "$PWD/php-src"
      - name: build static php-fpm-ng on Alpine
        run: |
          mkdir build-static out-static
          docker run --rm \
            -v "$PWD/php-src:/src" \
            -v "$PWD/build-static:/build" \
            -v "$PWD:/repo" \
            -v "$PWD/out-static:/out" \
            alpine:3.22 sh /repo/build/static-full.sh
      - name: verify static binary in a scratch image
        run: ./build/test-static-full.sh "$PWD/out-static/php-fpm-ng-full"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: static-musl-logs
          path: |
            out-static/configure-full.log
            out-static/make-full.log
          retention-days: 14

  # Task 010: the HTTP gateway must drop root before it ever accepts a
  # connection, instead of holding the master's identity (and the TLS private
  # key) for its whole life. Needs to run as root, which the phpt job's
  # runner isn't by default -- kept as its own job for that reason, not
  # folded into phpt.
  gateway-privileges:
    needs: build
    runs-on: ${{ github.event.inputs.runner == 'ubuntu-latest' && 'ubuntu-latest' || 'fpmng' }}
    container:
      image: ghcr.io/crazy-goat/php-fpm-ng-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      volumes:
        - /opt/gh-runner/cache/ccache:/ccache
      # No --user here, unlike every other job: this one asserts the gateway
      # drops root before accepting a connection, so it has to start with it.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: fpmng-canonical-build
          path: build-out
      - name: verify the gateway drops privileges (task 010)
        run: |
          chmod +x build-out/bin/php-fpm-ng
          ./build/test-http-gateway-privileges.sh "$PWD/build-out/bin/php-fpm-ng"

      # This is the only job that writes to a self-hosted workspace as root.
      # Whichever job the runner picks up next checks out as uid 1001 and
      # cannot delete what root left behind, so actions/checkout fails before
      # its first step. Hand the workspace back on the way out.
      - name: hand the workspace back to the runner account
        if: always()
        run: chown -R 1001:1001 "$GITHUB_WORKSPACE"

  # Task 040: a renewed TLS certificate must take effect in every gateway
  # process without a restart. Needs multiple real gateway processes under
  # SO_REUSEPORT, a load generator running across the file swap, and a
  # deliberately broken candidate -- a shell-driven scenario like
  # gateway-privileges above, but no root needed (nothing here drops
  # privileges), so it stays out of the phpt job rather than needing sudo.
  tls-reload:
    needs: build
    runs-on: ${{ github.event.inputs.runner == 'ubuntu-latest' && 'ubuntu-latest' || 'fpmng' }}
    container:
      image: ghcr.io/crazy-goat/php-fpm-ng-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      volumes:
        - /opt/gh-runner/cache/ccache:/ccache
      # ubuntu-latest ran jobs unprivileged and the suite depends on it: as
      # root php-fpm refuses to start, so the fpmng suite reports PASS=0 with
      # 47 skips and still looks green. uid 1001 is gh-runner here and the
      # runner user on GitHub-hosted images, so it owns the workspace either way.
      options: --user 1001:1001
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: fpmng-canonical-build
          path: build-out
      - name: verify TLS certificate reload without restart (task 040)
        run: |
          chmod +x build-out/bin/php-fpm-ng
          ./build/test-http-tls-reload.sh "$PWD/build-out/bin/php-fpm-ng"

  # Issue #90: the per-connection read deadline (task 031) used to fire into a
  # bufferevent evhttp had already freed, killing the whole gateway process
  # with SIGSEGV. Same shape as tls-reload above -- real gateway processes,
  # real TLS, no root -- and its own job so a crash here is not read as a
  # reload failure.
  read-deadline:
    needs: build
    runs-on: ${{ github.event.inputs.runner == 'ubuntu-latest' && 'ubuntu-latest' || 'fpmng' }}
    container:
      image: ghcr.io/crazy-goat/php-fpm-ng-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      volumes:
        - /opt/gh-runner/cache/ccache:/ccache
      # ubuntu-latest ran jobs unprivileged and the suite depends on it: as
      # root php-fpm refuses to start, so the fpmng suite reports PASS=0 with
      # 47 skips and still looks green. uid 1001 is gh-runner here and the
      # runner user on GitHub-hosted images, so it owns the workspace either way.
      options: --user 1001:1001
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: fpmng-canonical-build
          path: build-out
      - name: verify a gateway survives its own read deadline (issue #90)
        run: |
          chmod +x build-out/bin/php-fpm-ng
          ./build/test-http-read-deadline.sh "$PWD/build-out/bin/php-fpm-ng"

  # Issue #129: a synchronous hard write error while handing a request to an
  # upstream freed the connection and the upstream underneath their caller.
  # Nothing observable from outside the process changes -- the gateway answers
  # 502 and keeps serving on a corrupted heap -- so this cell runs the gateway
  # under valgrind and fails on any invalid access inside fpm_http.c. Own job
  # for the same reason as read-deadline above: memcheck makes it slow, and a
  # failure here means one specific thing.
  gateway-write-failure:
    needs: build
    runs-on: ${{ github.event.inputs.runner == 'ubuntu-latest' && 'ubuntu-latest' || 'fpmng' }}
    container:
      image: ghcr.io/crazy-goat/php-fpm-ng-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      volumes:
        - /opt/gh-runner/cache/ccache:/ccache
      # ubuntu-latest ran jobs unprivileged and the suite depends on it: as
      # root php-fpm refuses to start, so the fpmng suite reports PASS=0 with
      # 47 skips and still looks green. uid 1001 is gh-runner here and the
      # runner user on GitHub-hosted images, so it owns the workspace either way.
      options: --user 1001:1001
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: fpmng-canonical-build
          path: build-out
      - name: verify a synchronous upstream write failure corrupts nothing (issue #129)
        run: |
          chmod +x build-out/bin/php-fpm-ng
          ./build/test-http-gateway-write-failure.sh "$PWD/build-out/bin/php-fpm-ng"

  plain-http-listener:
    needs: build
    runs-on: ${{ github.event.inputs.runner == 'ubuntu-latest' && 'ubuntu-latest' || 'fpmng' }}
    container:
      image: ghcr.io/crazy-goat/php-fpm-ng-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      volumes:
        - /opt/gh-runner/cache/ccache:/ccache
      # ubuntu-latest ran jobs unprivileged and the suite depends on it: as
      # root php-fpm refuses to start, so the fpmng suite reports PASS=0 with
      # 47 skips and still looks green. uid 1001 is gh-runner here and the
      # runner user on GitHub-hosted images, so it owns the workspace either way.
      options: --user 1001:1001
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: fpmng-canonical-build
          path: build-out
      - name: verify the redirect-only plain HTTP companion (task 042)
        run: |
          chmod +x build-out/bin/php-fpm-ng
          ./build/test-http-plain-listener.sh "$PWD/build-out/bin/php-fpm-ng"
