; Tier 2: a gateway in front of one FastCGI pool -- TLS, a static file, and a
; PHP request. See examples/http/README.md for how to generate the certificate
; and for the curl commands that verify each of the three.
;
; Since issue #388 the proxy is pool.type = gateway and the application is an
; ordinary pool.type = fastcgi behind it; `listen` on the gateway is the
; public HTTP(S) port and http.route[] says which pool serves which path.

[global]
error_log = /dev/stderr
daemonize = no

[gw]
pool.type = gateway
listen = 0.0.0.0:8443
chdir = /www
http.static = yes
http.tls_cert = /certs/fullchain.pem
http.tls_key = /certs/privkey.pem
http.route[app] = /

[app]
pool.type = fastcgi
listen = 127.0.0.1:9000
pm = static
pm.max_children = 2
chdir = /www
