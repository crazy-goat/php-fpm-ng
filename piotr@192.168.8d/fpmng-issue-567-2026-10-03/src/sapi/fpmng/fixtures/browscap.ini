; Written for this repository (issue #559). It replaces the browscap.ini that
; php-src ships under ext/standard/tests/misc/, a 296 KB third-party data file
; whose terms are not stated.
;
; The only consumer is the upstream gh12621.phpt, a regression test for a
; segfault when `browscap` is set through php_admin_value in a pool. Any valid
; browscap file with one section that matches "Konqueror/2.0" exercises that
; path, and the test prints that section's pattern: "*Konqueror/2.*".

[GJK_Browscap_Version]
Version=1
Released=Thu, 01 Oct 2026 00:00:00 -0000

[DefaultProperties]
Browser="DefaultProperties"
Version=0
MajorVer=0
MinorVer=0
Platform=unknown
Crawler=false

[Konqueror]
Parent=DefaultProperties
Browser="Konqueror"
Frames=true
Tables=true

[*Konqueror/2.*]
Parent=Konqueror
Version=2.0
MajorVer=2
MinorVer=0
