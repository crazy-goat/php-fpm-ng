name: async-sync

# Issues #374, #520, #528, #620. Lives on BOTH branches, with two different
# bodies: main carries a stub (GitHub only dispatches a workflow file that
# exists on the default branch), this is the real one, run with --ref async.
#
# NO schedule: here. A `schedule:` trigger is read from the default branch
# only, so one in this file on async would never fire. The clock is main's
# async-sync-trigger.yml, which dispatches this workflow on ref async. This
# file therefore has workflow_dispatch only.
#
# What a run does: merge origin/main into async with a real merge commit (never
# a squash, never a rebase), refuse a merge that deletes async-only paths
# (#520), build and test the merge commit through async-fiber.yml (main's
# contract: pristine vendor check and the default SDK build without executor
# symbols; and the fiber executor from the php-src flow), and only then push
# async. On a conflict, a deleting merge, a failed build or a rejected push it
# opens or updates one issue (build/ci-report-async-sync-failure.sh) that names
# the conflicted files. The merge commit must reach async as a fast-forward
# push (this workflow does that); a hand merge must never be squash-merged
# through a PR, or main stops being an ancestor of async.
on:
  workflow_dispatch:
    inputs:
      allow_deletions:
        description: "Paths the merge from main may delete from async (issue #520), whitespace-separated. Only for a run whose deletion report you have reviewed."
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

env:
  # A scratch ref that only this workflow touches, so the merge commit exists
  # somewhere between the jobs below without either job needing to reconstruct
  # git history from an artifact. Force-pushed at the start of every run, and
  # deleted again at the end regardless of outcome (the last job's `if: always()`
  # cleanup step) so a failed run does not leave one behind for the next run to
  # trip over.
  SCRATCH_REF: _async-sync-scratch

jobs:
  # Step 1 (issue #374): merge origin/main into async. Runs on the plain
  # ubuntu-latest runner, NOT the CI image container that the build/test job
  # below uses -- this job needs `gh`, which ships on GitHub-hosted runners by
  # default and is deliberately absent from .github/docker/ci.Dockerfile (see
  # build/ci-cancel-run.sh's note on why that script uses curl instead).
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: async
          fetch-depth: 0

      - name: git identity for the merge commit
        run: |
          git config user.name "php-fpm-ng-bot"
          git config user.email "actions@users.noreply.github.com"

      # Issue #520: fetch, merge, refuse a merge that deletes async paths,
      # and push the scratch ref only when none of that went wrong -- all in
      # one script, so build/test-async-sync-guard.sh tests exactly this
      # step. A clean `git merge` is not enough on its own: main's #373 cut
      # merged into async cleanly and deleted all 46 fiber/async paths.
      - name: merge origin/main into async and publish the scratch ref
        id: merge
        env:
          # workflow_dispatch only; empty when not given. Passed through the
          # environment, never interpolated into the script.
          ALLOW_DELETIONS: ${{ inputs.allow_deletions }}
        run: |
          chmod +x build/async-sync-merge.sh
          allow=""
          if [ -n "$ALLOW_DELETIONS" ]; then
            printf '%s\n' "$ALLOW_DELETIONS" | tr -s '[:space:]' '\n' | sed '/^$/d' > /tmp/allow-deletions.txt
            allow=/tmp/allow-deletions.txt
          fi
          rc=0
          ./build/async-sync-merge.sh origin main "$SCRATCH_REF" /tmp/deleted-paths.txt $allow || rc=$?
          case "$rc" in
            0) echo "result=clean" >> "$GITHUB_OUTPUT" ;;
            2) echo "result=conflict" >> "$GITHUB_OUTPUT" ;;
            3) echo "result=deletes" >> "$GITHUB_OUTPUT" ;;
            4) echo "result=scratch-push" >> "$GITHUB_OUTPUT" ;;
            *) exit "$rc" ;;
          esac

      - name: report the conflict (issue #374 step 1)
        if: steps.merge.outputs.result == 'conflict'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x build/ci-report-async-sync-failure.sh
          {
            echo "\`git merge origin/main\` into \`async\` conflicted, so this"
            echo "run did not push anything. Conflicted files:"
            echo
            echo '```'
            cat /tmp/deleted-paths.txt
            echo '```'
            echo
            echo "Resolve by hand, with a merge commit (no rebase, no squash):"
            echo
            echo '```'
            echo "git fetch origin main"
            echo "git checkout async && git pull"
            echo "git merge origin/main"
            echo "# resolve, commit, push"
            echo '```'
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > /tmp/conflict-body.md
          ./build/ci-report-async-sync-failure.sh "merge conflict" /tmp/conflict-body.md

      - name: report the scratch push failure
        if: steps.merge.outputs.result == 'scratch-push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x build/ci-report-async-sync-failure.sh
          git fetch origin async
          {
            echo "The merge of \`origin/main\` into \`async\` was clean, but"
            echo "pushing the merge commit to the scratch ref \`$SCRATCH_REF\`"
            echo "was refused, so nothing was built or pushed. This is the first"
            echo "push that carries main's changes; a merge that touches"
            echo "\`.github/workflows/\` needs a token with the \`workflow\` scope."
            echo
            echo "Files this merge changes in \`.github/workflows/\`:"
            echo '```'
            git diff --name-only origin/async HEAD -- .github/workflows || true
            echo '```'
            echo
            echo "Git said:"
            echo '```'
            cat /tmp/deleted-paths.txt
            echo '```'
            echo
            echo "Merge by hand (no rebase, no squash) or give the workflow a token that may push workflow files."
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > /tmp/scratch-body.md
          ./build/ci-report-async-sync-failure.sh "scratch push rejected" /tmp/scratch-body.md

      - name: report the deletion (issue #520)
        if: steps.merge.outputs.result == 'deletes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x build/ci-report-async-sync-failure.sh
          {
            echo "\`git merge origin/main\` into \`async\` went through without"
            echo "a conflict, but it would delete these paths that exist on"
            echo "\`async\` (issue #520), so this run pushed nothing -- neither"
            echo "\`async\` nor the scratch ref:"
            echo
            echo '```'
            cat /tmp/deleted-paths.txt
            echo '```'
            echo
            echo "Git cannot tell an async-only file main dropped (the #373 cut)"
            echo "from a shared file main retired on purpose (patches/0006 in"
            echo "#420). If every path above is a deliberate deletion, re-run"
            echo "async-sync by hand with them in the \`allow_deletions\` input."
            echo "Otherwise merge by hand and restore the paths that must stay."
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > /tmp/deletion-body.md
          ./build/ci-report-async-sync-failure.sh "merge would delete async paths" /tmp/deletion-body.md

      # Stop here on a conflict, a deletion or a refused scratch push: the
      # report above is the point of this run, and there is nothing for the
      # build/test job to build.
      - name: fail the job on conflict, deletion or scratch push failure
        if: steps.merge.outputs.result != 'clean'
        run: exit 1

      - name: record the merge commit SHA
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
    outputs:
      sha: ${{ steps.sha.outputs.sha }}

  # Step 2+3: build and test the merge commit. One definition of the fiber
  # build, shared with the PR checks: .github/workflows/async-fiber.yml.
  build-and-test:
    needs: merge
    uses: ./.github/workflows/async-fiber.yml
    with:
      ref: ${{ needs.merge.outputs.sha }}
    permissions:
      contents: read

  # Step 4 (issue #374): push on full success; report and clean up on
  # failure. `if: always()` so this runs even when build-and-test failed --
  # that is exactly the case it exists to handle. It does not run at all when
  # `merge` itself failed (a conflict, or a merge that would delete async
  # paths), because that job already reported and left nothing on the scratch
  # ref to push or clean up.
  push-or-report:
    needs: [merge, build-and-test]
    if: always() && needs.merge.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SCRATCH_REF }}
          fetch-depth: 0

      # A plain (non-force) push: if async moved while this run built, or a
      # ruleset or the token's missing `workflow` scope refuses it, the push is
      # rejected and the next step says so in an issue instead of leaving a red
      # run nobody opens.
      - name: push the merge commit to async
        id: push
        if: needs.build-and-test.result == 'success'
        run: |
          rc=0
          git push origin "HEAD:refs/heads/async" 2> /tmp/push.err || rc=$?
          cat /tmp/push.err >&2
          if [ "$rc" -ne 0 ]; then
            echo "rejected=true" >> "$GITHUB_OUTPUT"
          fi

      - name: report the rejected push
        if: steps.push.outputs.rejected == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x build/ci-report-async-sync-failure.sh
          git fetch origin main async
          {
            echo "The merge of \`origin/main\` into \`async\` built and passed"
            echo "(merge commit \`${{ needs.merge.outputs.sha }}\`), but pushing it to"
            echo "\`async\` was rejected. Either \`async\` moved during the run, or a"
            echo "ruleset or the token refused it (a merge that touches"
            echo "\`.github/workflows/\` needs a token with the \`workflow\` scope)."
            echo
            echo "Files changed by this merge in \`.github/workflows/\`:"
            echo '```'
            git diff --name-only "origin/async" HEAD -- .github/workflows || true
            echo '```'
            echo
            echo "Git said:"
            echo '```'
            cat /tmp/push.err
            echo '```'
            echo
            echo "Merge by hand (no rebase, no squash) or re-run the workflow."
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > /tmp/push-body.md
          ./build/ci-report-async-sync-failure.sh "push rejected" /tmp/push-body.md
          exit 1

      - name: report the test/build failure (issue #374 step 4)
        if: needs.build-and-test.result != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x build/ci-report-async-sync-failure.sh
          {
            echo "The merge from main went through cleanly (merge"
            echo "commit \`${{ needs.merge.outputs.sha }}\`), but the"
            echo "main's SDK contract check (vendor check, default build without"
            echo "executor symbols) or the \`--enable-fpmng-fiber\` build or its"
            echo "phpt run failed, so nothing was pushed to \`async\`."
            echo
            echo "Build/test job: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "Its \`async-sync-phpt-results\` artifact (if uploaded) has"
            echo "the per-test results; the job log has the configure/build"
            echo "output."
          } > /tmp/failure-body.md
          ./build/ci-report-async-sync-failure.sh "build or test failure" /tmp/failure-body.md

      - name: delete the scratch ref
        if: always()
        run: git push origin --delete "refs/heads/${{ env.SCRATCH_REF }}" || true
