; Tier 1: the whole thesis in one process -- http gateway, cron, supervisor
; and status, started together by a single `php-fpm-ng -y fpm-ng.conf -F`.
; See examples/combined/README.md for how each pool is verified.
;
; No `user`/`group` anywhere: the container runs as a non-root user already
; (see Dockerfile), so php-fpm-ng never needs to setuid a worker and the
; mandatory-user check (fpm_conf.c) does not apply.

[global]
error_log = /dev/stderr
daemonize = no
; >= [worker]'s supervisor.stop_timeout (default 10s), or the master's own
; SIGTERM escalation (e.g. `docker stop`) kills that pool's child before
; stop_timeout gets a chance to -- php-fpm-ng warns about this if unset.
process_control_timeout = 15s

; HTTP gateway: serves examples/combined/www over both a static path and PHP.
[app]
pool.type = http
listen = 127.0.0.1:9000
http.listen = 0.0.0.0:8080
pm = static
pm.max_children = 2
chdir = /www
http.static = yes
http.front_controller = /index.php

; Operator endpoints, served on their own ports -- not through the gateway
; (there /status falls through to the front controller). pool.type = status
; was removed in issue #278; the replacement is per-pool pm.status_path +
; pm.status_listen and pm.metrics_path + pm.metrics_listen. The JSON status
; aggregates [app]'s scoreboard, [tick]'s last run/next run and [worker]'s
; running state at once (see the combined README for the request that
; proves it).
pm.status_path = /status
pm.status_listen = 0.0.0.0:8081
pm.metrics_path = /metrics
pm.metrics_listen = 0.0.0.0:8082

; Runs cron-tick.php every minute -- short enough to verify without an
; hours-long wait. cron.log records fpm's own view (start/exit/duration);
; cron-tick.php additionally writes its own marker file.
[tick]
pool.type = cron
cron.schedule = * * * * *
cron.script = /www/cron-tick.php
cron.log = /www/data/cron.log

; One long-lived worker process, restarted unconditionally if it ever exits.
[worker]
pool.type = supervisor
supervisor.script = /www/worker.php
supervisor.processes = 1
supervisor.restart = always
supervisor.restart_delay = 1

