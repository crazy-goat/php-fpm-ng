services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\Redis\ConnectionFactory:
        arguments:
            $dsn: '%env(REDIS_DSN)%'

    App\Probe\Gate:
        arguments:
            $prefix: '%env(REDIS_PREFIX)%'
