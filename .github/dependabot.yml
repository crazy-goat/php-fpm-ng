version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - dependencies
    commit-message:
      prefix: "ci(deps)"
  # The scratch image and the package-gate images. Not covered, on purpose:
  # examples/ (runnable demos) and tests/frameworks/ (the Slim 4 smoke test, whose
  # versions are pinned by the test; its lock only gets security-alert bumps).
  - package-ecosystem: docker
    directories:
      - "/docker"
      - "/.github/docker"
    schedule:
      interval: weekly
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"
