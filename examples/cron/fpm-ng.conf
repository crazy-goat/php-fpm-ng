; Tier 2: pool.type = cron alone. Every minute, not the default @daily, so
; this example is verifiable in under two minutes -- see README.md.

[global]
error_log = /dev/stderr
daemonize = no

[tick]
pool.type = cron
cron.schedule = * * * * *
cron.script = /www/tick.php
cron.log = /www/data/cron.log
