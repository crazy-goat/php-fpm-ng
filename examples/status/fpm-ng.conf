; Tier 2: the operator endpoint (operator.*) on a real pool. [app] reports its
; own scoreboard on two listeners of their own, raw, not through the gateway
; and without PHP. pool.type = status was removed in issue #278; this is its
; replacement (docs/operator-endpoint.md). See README.md for the curl
; sequence that proves both endpoints reflect real traffic.

[global]
error_log = /dev/stderr
daemonize = no

[gw]
pool.type = gateway
listen = 0.0.0.0:8080
chdir = /www
http.route[app] = /

[app]
pool.type = fastcgi
listen = 127.0.0.1:9000
pm = static
pm.max_children = 2
chdir = /www
operator.status_path = /status
operator.status_listen = 0.0.0.0:8081
operator.metrics_path = /metrics
operator.metrics_listen = 0.0.0.0:8082
