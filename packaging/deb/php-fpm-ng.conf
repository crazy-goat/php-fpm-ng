; php-fpm-ng master configuration, as shipped by the .deb.
;
; This binary is dynamically linked against the distribution's libphp
; (libphp8.5-embed). That is the whole point of the package -- nothing is
; compiled on your machine -- and it is also why two pool types are missing
; from this file. See pool.d/www.conf.

[global]
error_log = /var/log/php-fpm-ng/error.log

; systemd runs the master in the foreground and supervises it, so there is no
; pid file here and nothing to keep in sync with one; see
; /lib/systemd/system/php-fpm-ng.service. The unit passes --nodaemonize as
; well, so this line is what a hand-started master gets.
daemonize = no

include=/etc/php-fpm-ng/pool.d/*.conf
