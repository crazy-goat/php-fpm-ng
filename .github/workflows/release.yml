name: release

# Issue #223: a tag produces a Release carrying the .deb, the .apk and
# SHA256SUMS, built by CI and by nothing else.
#
# The packages are built by build/ci-package-gate.sh. That is deliberate and is
# the whole reason this workflow is short: the file that gets attached
# here is the file that was just installed into a container with no compiler in
# it and scored the expected PASS/FAIL/SKIP counts. A separate "release build"
# would be a second artefact nobody tested.
#
# UNSIGNED, ON PURPOSE. The decision is recorded on issue #223: assets on a
# Release, installed by path (`apt install ./file.deb`,
# `apk add --allow-untrusted ./file.apk`), with SHA256SUMS alongside. What
# cannot be unsigned is a hosted apt/apk repository, which asks a machine to
# trust a host for every future upgrade -- that is out of scope until there is
# a signing key with a distribution, rotation and revocation story behind it.
on:
  push:
    tags:
      - "v*"
  # Rehearsable without cutting a tag. The assets are built and uploaded as a
  # workflow artifact, and no Release is created.
  workflow_dispatch:

permissions:
  contents: write
  # The gate script pulls the package-gate images from ghcr, and they are
  # private: without this the `docker login` step below gets a token that
  # cannot read them, and ci-package-gate.sh silently falls back to building
  # both stages from a bare base image -- slower, and no longer the same
  # images the pull request was gated with.
  packages: read

# No php-src, and no engine build, anywhere on this path (issue #424): stage 1
# of the gate installs the distribution's PHP 8.5 SDK (php8.5-dev +
# libphp8.5-embed on Ubuntu 26.04, php85-dev + php85-embed on Alpine edge) with
# the distribution's package manager and runs build/libphp-build.sh against it.
# The gate prints the packages it installs and the php-config version it
# resolved, and leaves libphp-build's commands.log next to each package.

jobs:
  packages:
    # Not containerised: the script drives `docker run` with host bind mounts, and -v paths are
    # resolved by the host daemon, so a containerised copy would mount empty
    # directories.
    runs-on: ubuntu-latest
    env:
      # Refuse the bare-base-image fallback. Without it a login failure would
      # cut a release built in images that are not the ones the pull request
      # was gated with, and say nothing -- which is the whole point of the
      # packages: read line above.
      FPMNG_REQUIRE_WARM_IMAGES: "1"
    steps:
      - uses: actions/checkout@v7

      # The notes are the CHANGELOG.md section of the tag, read from the tagged
      # commit (merge the `## [X.Y.Z]` section before tagging,
      # docs/release-workflow.md). Done first, so a missing section fails in
      # seconds and not after the package gate. The CHANGELOG part is cut to
      # fit GitHub's 125000-character limit; the fixed install paragraph is
      # appended after that cut, so it is never lost.
      - name: extract the release notes from CHANGELOG.md
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## \[/ { found = (index($0, "[" v "]") > 0 || index($0, "[v" v "]") > 0); next }
            found
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no non-empty section for ${version}"
            exit 1
          fi
          cat > release-install.md <<'NOTE'

          ## Install

          The packages carry no PHP. They depend on the distribution's embed package for the
          libphp they were linked against, which is named both in the file name and in the
          dependency. Install them by path:

              sudo apt install ./php-fpm-ng_*.deb
              sudo apk add --allow-untrusted ./php-fpm-ng-*.apk

          They are unsigned (decision on issue #223): check them against SHA256SUMS first. See
          docs/install.md for what the packaged build supports.
          NOTE
          python3 - "$GITHUB_REF_NAME" <<'PY'
          import sys
          limit = 120000
          tag = sys.argv[1]
          install = open('release-install.md', encoding='utf-8').read()
          text = open('release-notes.md', encoding='utf-8').read()
          room = limit - len(install)
          if len(text) > room:
              tail = ("\n\n_The notes were shortened because of the GitHub size limit. "
                      f"See [CHANGELOG.md](https://github.com/crazy-goat/php-fpm-ng/blob/{tag}/CHANGELOG.md) "
                      "for the full text._\n")
              text = text[:room - len(tail)]
              text = text[:text.rfind('\n')] + tail
              print(f"::warning::Release notes truncated to {len(text)} characters")
          open('release-notes.md', 'w', encoding='utf-8').write(text + install)
          PY

      - name: log in to ghcr.io for the package-gate images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin

      # The version the packages call themselves. On a tag it is the tag; on a
      # manual rehearsal it is the commit, so a rehearsal artefact can never be
      # mistaken for a release one.
      - name: name this build
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            echo "FPMNG_RELEASE=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "FPMNG_RELEASE=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          fi

      - name: build, install and test the .deb
        run: ./build/ci-package-gate.sh deb "$PWD/out-package-deb"
      - name: build, install and test the .apk
        run: ./build/ci-package-gate.sh apk "$PWD/out-package-apk"

      # The second package (issue #294): the same release built
      # --enable-fpmng-tls --enable-fpmng-acme, so that the remedy for the TLS
      # regression of issues #280 and #281 is "install php-fpm-ng-tls" rather
      # than "get a compiler". Beta and unaudited, and its package description
      # says so.
      #
      # Gated here and only here since issue #393 (the pull-request matrix does
      # not run the package gate). A TLS-only regression is exactly what shipped
      # in the v0.5.0 tag (PR #320) and what a flake, apk-flavoured this time,
      # repeated for v0.5.1; the workflow_dispatch rehearsal is the cheap way to
      # see the gate before a tag.
      - name: build, install and test the TLS .deb
        env:
          FPMNG_PACKAGE_TLS: "1"
        run: ./build/ci-package-gate.sh deb "$PWD/out-package-deb-tls"
      - name: build, install and test the TLS .apk
        env:
          FPMNG_PACKAGE_TLS: "1"
        run: ./build/ci-package-gate.sh apk "$PWD/out-package-apk-tls"

      # The asset names carry both halves: our release and the PHP minor the
      # binary is a SAPI for. A user with 8.4 and 8.5 installed has to be able
      # to tell two of these apart before installing either, and the file name
      # is what they see first -- the Depends line is one `dpkg -I` later.
      - name: collect the assets
        run: |
          mkdir -p assets
          # Both packages, named the same way, so that the one difference
          # between them -- TLS and ACME compiled in -- is in the file name and
          # not only in a description the user reads after downloading.
          collect() {
            name=$1 debdir=$2 apkdir=$3
            deb=$(find "$debdir" -maxdepth 1 -name "${name}_*.deb" ! -name 'wrong-minor*' | head -1)
            apk=$(find "$apkdir/repo" -name "$name-[0-9]*.apk" | head -1)
            [ -n "$deb" ] && [ -n "$apk" ] || { echo "an expected $name package is missing" >&2; exit 1; }
            php_deb=$(dpkg-deb -f "$deb" Depends | sed -n 's/.*libphp\([0-9.]*\)-embed.*/\1/p')
            php_apk=$(basename "$apk" | sed -n "s/^$name-\\([0-9]*\\.[0-9]*\\)\\..*/\\1/p")
            cp "$deb" "assets/${name}_${FPMNG_RELEASE}_php${php_deb}_$(dpkg --print-architecture).deb"
            cp "$apk" "assets/${name}-${FPMNG_RELEASE}-php${php_apk}-$(uname -m).apk"
          }
          collect php-fpm-ng out-package-deb out-package-apk
          collect php-fpm-ng-tls out-package-deb-tls out-package-apk-tls
          ( cd assets && sha256sum ./*.deb ./*.apk > SHA256SUMS )
          cat assets/SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: assets
          retention-days: 14

      # Only a tag publishes. The rehearsal above stops at the artifact.
      # --verify-tag refuses to create a tag from a release. Re-run safe: a
      # leftover draft (an interrupted run) is completed and published. A
      # published release is never touched: fix forward with a new tag.
      - name: publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != true ]; then
              echo "::error::release $GITHUB_REF_NAME is already published; fix forward with a new tag"
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" assets/* --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md --draft=false
          else
            flags=()
            case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
            gh release create "$GITHUB_REF_NAME" assets/* \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md \
              --verify-tag \
              "${flags[@]}"
          fi
