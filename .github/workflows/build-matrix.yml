name: build

# Task 002: prove the tree still builds and our php-src patches still apply.
# See task 002 (done; docs/task-archive.md). The dynamic build remains a single cell
# rather than the full ZTS x session x TLS matrix. The static musl build is
# covered separately below.
#
# Runs on pull_request, and on push to main. The push run builds nothing that
# a merge needs -- it exists to write the ccache entries that the next pull
# request restores. A cache written on a PR branch is visible only to that
# branch; one written on the default branch is visible to every branch, so
# without a run on main the first run of every new branch compiles php-src
# from scratch.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      php_src_ref:
        description: "php-src commit/tag to build against (overrides the pinned default)"
        required: false
        default: ""

# Every push to a PR branch restarts the whole 16-job matrix; without this the
# superseded run keeps burning minutes to completion. main is excluded: see
# the concurrency block below.
#
# Every job runs on ubuntu-latest. It used to run on the self-hosted `poligon`
# box, whose runners were unregistered and whose services were disabled on
# 2026-09-12 -- until then they stayed online and kept picking up jobs from
# branches older than this file: this repository is public, and GitHub-hosted minutes
# are free for public repositories, while a self-hosted runner on a public
# repository is a machine that a pull request from a stranger can be made to
# execute code on.
#
# Losing that box cost the two things it kept on its own disk between runs: a
# ccache directory and a configured php-src tree (issue #196). The ccache is
# replaced by actions/cache in the three jobs that compile -- see the cache
# step in each. The reused tree is not replaced: it is a full configured
# php-src checkout, far too large to tar into the cache service every run, so
# every job configures from scratch and leans on ccache for the compile.
#
# What the cache is worth, measured on two consecutive runs on main --
# 34702558731 cold, 34703566697 warm off it:
#
#   build              202 s -> 89 s
#   static-musl        318 s -> 107 s
#   fpmng-phpt-fiber   262 s -> 168 s
#
# Per job, not per run: run wall clock is dominated by how many hosted runners
# the account gets at that moment, and the warm run of the pair happened to
# queue behind another.
#
# Every job below except static-musl and package-gate runs in
# ghcr.io/crazy-goat/php-fpm-ng-ci (built by ci-image.yml from
# .github/docker/ci.Dockerfile), which is why none of them apt-get anything
# any more. The repeated container: block is unavoidable -- GitHub Actions
# does not expand YAML anchors.
#
# KNOWN LIMIT, fork pull requests. That image is a private package, and a
# fork's GITHUB_TOKEN cannot read it: such a pull request dies at `Initialize
# containers` with 403 before any step runs. The fix is to make the two ghcr
# packages public (php-fpm-ng-ci and php-fpm-ng-package-gate); until that is
# done, a contribution from a fork has to be re-pushed as a branch here to be
# tested.
#
# static-musl and package-gate are the exceptions: they drive `docker run`
# with host bind mounts, and -v paths are resolved by the host daemon, so a
# containerised copy of them would mount empty directories.
# actions: write is only for build/ci-cancel-run.sh (issue #209), the
# if: failure() step every job ends with: cancelling a run is an Actions API
# write.
#
# The other two are not decoration. Naming any permission drops every
# unnamed one to none, and this workflow needs both of them: contents: read
# because every job checks the repository out, and packages: read because
# every job except static-musl pulls ghcr.io/crazy-goat/php-fpm-ng-ci with
# secrets.GITHUB_TOKEN as the registry credential. Measured the hard way on
# this issue's first run: with only contents+actions, `Initialize containers`
# died with `403 Forbidden` from ghcr before any step ran.
permissions:
  contents: read
  packages: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Not on main. actions/cache does not save on a cancelled job, and the run on
  # main exists for nothing but its cache save (see the note on `on:` above):
  # two merges in quick succession would cancel the first and throw away
  # exactly the entry every new branch restores from.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Pinned by tag, not branch (docs/NOTES.md:2760: "php-src pinned by
  # tag, not branch"). Bumping this is a deliberate version bump, not an automatic
  # moving target — see docs/NOTES.md:2748-2755 on what a patch vs. minor bump
  # requires.
  PHP_SRC_REPO: https://github.com/php/php-src.git
  PHP_SRC_REF: ${{ github.event.inputs.php_src_ref || 'php-8.5.9' }}
  # The canonical configure line, in one place because more than one cell has
  # to use exactly it. fpmng-phpt-fiber (issue #97) is only meaningful as a
  # comparison against the default build: if the two configure lines drift --
  # the way --with-openssl was once added to just one of them for task 039 --
  # then a test can silently run on one cell and skip on the other, and the
  # fiber cell stops being evidence about the flag. Three copies of the same
  # string could not be kept in step by a comment, so there is one string.
  #
  # --enable-fpmng-tls: since issue #280 TLS termination is opt-in and OFF by
  # default, so without this flag every TLS test in the matrix would SKIP and
  # the four TLS jobs below would be testing a binary that cannot terminate
  # TLS. The shipped packages are the ones built WITHOUT it (see
  # build/ci-package-gate.sh); that difference is deliberate, and it is
  # asserted on both sides rather than assumed.
  #
  # --with-openssl: the C-level HAVE_FPM_HTTP_TLS (gateway TLS termination)
  # comes from libssl-dev and the flag above, but the CLI php built here needs
  # ext/openssl itself -- our own .phpt tests for TLS features (task 039's
  # fpmng-http-tls-chain.phpt, and 040/041/042) drive the gateway over a real
  # TLS handshake via PHP's ssl:// stream wrapper and openssl_x509_parse(),
  # both of which live in ext/openssl, not in core. Without this flag those
  # tests silently SKIP ("requires the openssl extension") instead of running
  # -- caught on task 039's first CI run.
  #
  # --enable-fpmng-acme: the same, one level up (issue #281). ACME is opt-in
  # and needs the TLS flag; without it the ACME tests and
  # fpmng-payload-distribution.phpt would SKIP here as they do in the package
  # gate, and nothing in CI would exercise the code at all.
  FPMNG_CONFIGURE_FLAGS: --disable-all --enable-fpmng --enable-fpmng-tls --enable-fpmng-acme --enable-session --with-openssl

jobs:
  # Task 014: the comment-content contract in workflow.md stays linked from the
  # contributor entry points. Fast — checkout only.
  comment-content-rule:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/crazy-goat/php-fpm-ng-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # uid 1001 is the `runner` account that owns the workspace on a hosted
      # image, so the container writes files the rest of the job can read. It
      # is also the only thing keeping this job off root, which the suites
      # depend on: as root php-fpm refuses to start, so a root job reports
      # PASS=0 with everything skipped and still looks green.
      options: --user 1001:1001
    steps:
      - uses: actions/checkout@v7
      - name: verify comment-content rule links (task 014)
        run: ./build/test-comment-content-rule.sh
      # Issue #209: 16 separate jobs, so GitHub's matrix `fail-fast` does not
      # apply. One red job otherwise leaves the other fifteen compiling for a
      # result nobody will read. The run ends as "cancelled" rather than
      # "failed";
      # build/ci-cancel-run.sh says why that is the price and what it costs.
      - name: fail fast -- cancel the rest of the run (issue #209)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./build/ci-cancel-run.sh

  # Issue #95: the fpmng runner's fpmng-*.phpt glob is checked against the tests
  # this repo owns, so a new test file cannot be silently unreachable. Hermetic
  # -- no build, no binary; the runner stops at its own preflight.
  fpmng-phpt-coverage:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/crazy-goat/php-fpm-ng-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # uid 1001 is the `runner` account that owns the workspace on a hosted
      # image, so the container writes files the rest of the job can read. It
      # is also the only thing keeping this job off root, which the suites
      # depend on: as root php-fpm refuses to start, so a root job reports
      # PASS=0 with everything skipped and still looks green.
      options: --user 1001:1001
    steps:
      - uses: actions/checkout@v7
      - name: verify fpmng .phpt coverage check (issue #95)
        run: ./build/test-fpmng-phpt-coverage.sh
      - name: fail fast -- cancel the rest of the run (issue #209)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./build/ci-cancel-run.sh

  # Fast, cheap: proves patches/*.patch still apply to the pinned php-src
  # revision. build/prepare.sh already exits 1 and prints "ERROR: patch does
  # not apply..." on a genuine failure (build/prepare.sh:144) — this job
  # just needs to run it and let that exit code fail the job.
  patches:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/crazy-goat/php-fpm-ng-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # uid 1001 is the `runner` account that owns the workspace on a hosted
      # image, so the container writes files the rest of the job can read. It
      # is also the only thing keeping this job off root, which the suites
      # depend on: as root php-fpm refuses to start, so a root job reports
      # PASS=0 with everything skipped and still looks green.
      options: --user 1001:1001
    steps:
      - uses: actions/checkout@v7
      - name: clone pinned php-src
        run: |
          git init php-src
          git -C php-src fetch --depth 1 "$PHP_SRC_REPO" "$PHP_SRC_REF"
          git -C php-src checkout FETCH_HEAD
      - name: apply patches (build/prepare.sh)
        run: ./build/prepare.sh "$PWD/php-src"
      - name: fail fast -- cancel the rest of the run (issue #209)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./build/ci-cancel-run.sh

  # Deliberately a single cell for now (non-ZTS, session static, TLS on),
  # not the full ZTS x session x TLS matrix from task 002 (done; docs/task-archive.md).
  # That matrix remains release-time work — see the task file's acceptance
  # criteria 3-4. Re-add strategy.matrix (zts/session/tls) before the first
  # release.
  build:
    needs: patches
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/crazy-goat/php-fpm-ng-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # uid 1001 is the `runner` account that owns the workspace on a hosted
      # image, so the container writes files the rest of the job can read. It
      # is also the only thing keeping this job off root, which the suites
      # depend on: as root php-fpm refuses to start, so a root job reports
      # PASS=0 with everything skipped and still looks green.
      options: --user 1001:1001
    env:
      # The CI image sets CCACHE_DIR=/ccache, which was a mount of the
      # self-hosted box's own disk. There is no such mount now, and / is not
      # writable by uid 1001, so the cache lives in the workspace -- which is
      # also the only place actions/cache can reach from inside a container job.
      # 900M rather than the image's 5G: the whole repository gets 10 GB of
      # cache, and only runs on main save one (see the save step below).
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 900M
      # Named here, not written to GITHUB_ENV by a step: there is no longer a
      # conditional tree location to pick between. The tree is built in the
      # workspace and thrown away with the runner.
      PHPSRC: ${{ github.workspace }}/php-src-dynamic
    steps:
      - uses: actions/checkout@v7

      # What replaces the ccache directory the self-hosted runner kept on its
      # own disk. Restore only; the save is a separate step after the compile,
      # and runs on main alone. The restore-key is the prefix, so a run picks
      # up the newest entry for this job and this php-src pin, which on a
      # branch is always the one the last run on main wrote -- that is why this
      # workflow now also runs on push to main.
      - name: restore the compiler cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-build-${{ env.PHP_SRC_REF }}-${{ github.sha }}
          restore-keys: |
            ccache-build-${{ env.PHP_SRC_REF }}-


      # Issue #196: one step in place of clone + prepare + buildconf + configure.
      # On a hosted runner there is never a tree to reuse, so what this buys
      # here is the four steps in one place and the key file it writes, not the
      # reuse it was written for.
      - name: php-src build tree
        env:
          CC: ccache gcc
          CXX: ccache g++
        run: |
          # shellcheck disable=SC2086 -- the flag list is meant to word-split
          ( set +e; ./build/ci-build-tree.sh "$PHPSRC" "$PHP_SRC_REPO" "$PHP_SRC_REF" $FPMNG_CONFIGURE_FLAGS 2>&1; echo "$?" > tree.rc ) | tee tree.log
          exit "$(cat tree.rc)"

      - name: build
        # The steps here run under `sh -e` -- this container has no bash, so
        # GitHub's usual `bash -e` default falls back to dash, where
        # `set -o pipefail` is an error ("Illegal option -o pipefail",
        # measured on run 34580495525). Without the exit status of the left
        # side of the pipe the step reports tee's, so a failed build looks
        # green and the error is only in the artifact. Hence the rc file --
        # and the `set +e` inside it, because errexit propagates into the
        # subshell and would abort it before the rc file was ever written.
        run: |
          # Issue #196: mark the tree unfinished for the duration of the build.
          # cancel-in-progress kills this step outright on every superseded
          # push, and a .o truncated by that kill keeps a fresh mtime, so make
          # would consider it current for good. ci-build-tree.sh starts over
          # when it finds this marker.
          touch "$PHPSRC/.fpmng-ci-dirty"
          ( set +e; make -C "$PHPSRC" -j"$(nproc)" fpmng cli 2>&1; echo "$?" > make.rc ) | tee make.log
          if [ "$(cat make.rc)" = 0 ]; then rm -f "$PHPSRC/.fpmng-ci-dirty"; fi
          exit "$(cat make.rc)"

      # Only main writes. The repository's cache budget is 10 GB and these
      # entries are up to 900M each; if every push to every branch saved one,
      # a handful of pull-request pushes would evict the main entry that every
      # new branch restores from -- the entry the `push: branches: [main]`
      # trigger exists to produce.
      - name: save the compiler cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-build-${{ env.PHP_SRC_REF }}-${{ github.sha }}

      # Issue #111: the build is warning-free in the files we ship, and stays
      # that way. -Werror is not available here -- this compiles all of
      # php-src, and upstream's warnings (Zend/zend_ini_scanner.l,
      # ext/json/json_scanner.re: 7 of the 13 seen on 2026-09-09) are not ours
      # to fix. The gate therefore filters the log by `git ls-files` on this
      # repo rather than by path: build/prepare.sh copies all of upstream's
      # sapi/fpm/ into sapi/fpmng/ before overlaying ours, so 20 of the 57 .c
      # files under sapi/fpmng/fpm/ in a prepared tree are upstream's and a
      # path prefix would claim them. See build/check-owned-warnings.sh.
      #
      # $PWD is the workspace root here (no working-directory), which is where
      # the build step's `tee make.log` lands. The script exits 2 -- not 0
      # -- if that log turns out to contain no compile of an owned file, so
      # moving either path cannot silently reduce this gate to a no-op.
      - name: no compiler warnings in our own sources (issue #111)
        run: |
          chmod +x build/check-owned-warnings.sh
          ./build/check-owned-warnings.sh "$PWD/make.log"

      # Issue #171: the .phpt suite tests this binary, and
      # fpmng-payload-distribution.phpt reads the payload out of the binary
      # under test -- so the CI binary has to carry one just like a packaged
      # build does.
      - name: embed the distribution payload (issue #171)
        run: |
          chmod +x build/embed-payload.sh
          # FPMNG_ACME=1: the payload is the ACME client, and since issue #281
          # it is embedded only into a build that was configured for it --
          # which this one is, via FPMNG_CONFIGURE_FLAGS.
          FPMNG_ACME=1 ./build/embed-payload.sh "$PHPSRC/sapi/fpmng/php-fpm-ng" "$PHPSRC/sapi/cli/php"

      - name: verify the binary that got built
        run: |
          test -x "$PHPSRC/sapi/fpmng/php-fpm-ng"
          file "$PHPSRC/sapi/fpmng/php-fpm-ng"
          strings "$PHPSRC/sapi/fpmng/php-fpm-ng" | grep -q 'X-Powered-By: PHP' || true
          "$PHPSRC/sapi/fpmng/php-fpm-ng" -v

      # Issue #280. configure does not fail on an unknown --enable flag, it
      # warns -- so the flag is asserted where it lands, in the configure log
      # and in the linked binary, and not on the command line that asked for
      # it. Without this every TLS test in the matrix would quietly SKIP and
      # the run would still be green.
      - name: assert TLS termination is really in this build (issue #280)
        run: |
          grep -q "TLS termination in fpm-ng\.\.\. yes" "$PHPSRC/.fpmng-ci-configure.log"
          ldd "$PHPSRC/sapi/fpmng/php-fpm-ng" | grep -q libevent_openssl

      # Issue #281, for the same reason and read the same way: the configure
      # log for the decision, and a symbol for what was actually compiled in.
      - name: assert ACME issuance is really in this build (issue #281)
        run: |
          grep -q "ACME certificate issuance in fpm-ng\.\.\. yes" "$PHPSRC/.fpmng-ci-configure.log"
          nm --defined-only "$PHPSRC/sapi/fpmng/php-fpm-ng" | grep -qw fpm_acme_challenge_init_main

      - name: stage artifact
        # A single top-level path, not a multi-entry `path:` list: with more
        # than one path, upload-artifact strips only their *common* ancestor,
        # which is sapi/ here (php-fpm-ng and tests live under sapi/fpmng,
        # cli's php lives under sapi/cli) — not the php-src/sapi/... layout
        # the phpt job expects. Staging a flat, single-root directory avoids
        # depending on that ancestor computation at all.
        run: |
          mkdir -p stage/bin stage/prepared/sapi/fpmng stage/prepared/ext/standard/tests/misc
          cp "$PHPSRC"/sapi/fpmng/php-fpm-ng stage/bin/
          cp "$PHPSRC"/sapi/cli/php stage/bin/
          cp -r "$PHPSRC"/sapi/fpmng/tests stage/prepared/sapi/fpmng/tests
          # fpmng-acme-state.phpt (task 044) requires ../acme/state.php relative to
          # the test itself -- stage that source alongside tests/, the same
          # way tests/ itself is staged, or the require fails on this job's
          # copy even though it works from a full build/prepare.sh tree.
          cp -r "$PHPSRC"/sapi/fpmng/acme stage/prepared/sapi/fpmng/acme
          # run-fpm-phpt.sh (build/run-fpm-phpt.sh:88) requires run-tests.php
          # directly below the "prepared php-src" path it's given.
          cp "$PHPSRC"/run-tests.php stage/prepared/
          # gh12621.phpt reads __DIR__/../../../ext/standard/tests/misc/browscap.ini
          # (a source-tree fixture, not a build product); without it the test
          # fails on a nonexistent browscap path rather than exercising fpmng.
          cp "$PHPSRC"/ext/standard/tests/misc/browscap.ini stage/prepared/ext/standard/tests/misc/
          # Strip the staged copies, not the originals: 34 MB of artifact per
          # run was 99.8% of this repository's Actions storage (issue #261),
          # and almost all of it is debug symbols in these two binaries. The
          # trade is that anyone who downloads this artifact to chase a core
          # dump from a failed test gets a stripped backtrace -- the build job
          # still has the unstripped binaries in its own workspace while it
          # runs, so the symbols exist where a crash would actually happen.
          strip stage/bin/php-fpm-ng stage/bin/php
          # Re-embed, because strip just threw the payload away. It is appended
          # past the last ELF section, not held in one, so strip(1) rewrites the
          # file without it -- build/embed-payload.sh:18-19 says so and
          # fpmng-payload-distribution.phpt caught it when this step first
          # stripped and stopped there (run 34699384655, FAIL=1 of 72). Running
          # the embed again afterwards is the whole fix: the script is
          # idempotent and this is a fresh copy that has lost its entry, so it
          # appends one.
          FPMNG_ACME=1 ./build/embed-payload.sh "$PWD/stage/bin/php-fpm-ng" "$PWD/stage/bin/php"
          du -sh stage

      - name: upload build (for the phpt job)
        uses: actions/upload-artifact@v7
        with:
          name: fpmng-canonical-build
          path: stage
          # One day, not three. Nothing reads this after its own run ends --
          # every consumer is a job in the same run -- so the only thing
          # retention buys is pulling the binary of a failed run by hand, and
          # that is worth a day. At three days and ~48 runs on a busy day this
          # artifact alone held 2.6 GB (issue #261).
          retention-days: 1
      - name: fail fast -- cancel the rest of the run (issue #209)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./build/ci-cancel-run.sh

  # Task 001 landed the copied upstream FPM .phpt suite and its runner
  # (build/run-fpm-phpt.sh); wire it into CI against the canonical build cell.
  phpt:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/crazy-goat/php-fpm-ng-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # uid 1001 is the `runner` account that owns the workspace on a hosted
      # image, so the container writes files the rest of the job can read. It
      # is also the only thing keeping this job off root, which the suites
      # depend on: as root php-fpm refuses to start, so a root job reports
      # PASS=0 with everything skipped and still looks green.
      options: --user 1001:1001
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: fpmng-canonical-build
          path: build-out
      - name: run the upstream FPM .phpt suite against php-fpm-ng
        run: |
          chmod +x build-out/bin/php-fpm-ng build-out/bin/php
          TEST_PHP_EXECUTABLE="$PWD/build-out/bin/php" \
          TEST_PHP_FPM_EXECUTABLE="$PWD/build-out/bin/php-fpm-ng" \
          ./build/run-fpm-phpt.sh "$PWD/build-out/prepared" "$PWD/phpt-results"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: phpt-results
          path: phpt-results
      - name: fail fast -- cancel the rest of the run (issue #209)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./build/ci-cancel-run.sh

  # Task 003: regression tests for pool.type, pool.executor, and request-less
  # pool types. Fiber cases skip on the canonical build (--enable-fpmng-fiber is
  # off by default); cron may take up to one minute.
  fpmng-phpt:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/crazy-goat/php-fpm-ng-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # uid 1001 is the `runner` account that owns the workspace on a hosted
      # image, so the container writes files the rest of the job can read. It
      # is also the only thing keeping this job off root, which the suites
      # depend on: as root php-fpm refuses to start, so a root job reports
      # PASS=0 with everything skipped and still looks green.
      options: --user 1001:1001
    steps:
      - uses: actions/checkout@v7
      # Issue #105: the locale leg of fpmng-http-direct-request-parity.phpt is
      # only discriminating under a Turkish locale -- toupper('i') returns 'i'
      # there, which is what used to corrupt the HTTP_* CGI keys. The runner
      # image carries C, C.utf8 and POSIX only, where even the pre-fix mapping
      # is correct, so without this the check would pass on a reverted fix. The
      # test names the locale it actually got on its own output line, so a run
      # where this step stopped working does not look the same as a real one.
      # The locale is generated in .github/docker/ci.Dockerfile; this step is
      # the assertion that the image still carries it.
      - name: assert tr_TR.UTF-8 is present (issue #105)
        run: locale -a | grep -i tr_TR
      - uses: actions/download-artifact@v8
        with:
          name: fpmng-canonical-build
          path: build-out
      - name: run fpmng-owned .phpt tests (task 003)
        run: |
          chmod +x build-out/bin/php-fpm-ng build-out/bin/php build/run-fpmng-phpt.sh
          TEST_PHP_EXECUTABLE="$PWD/build-out/bin/php" \
          TEST_PHP_FPM_EXECUTABLE="$PWD/build-out/bin/php-fpm-ng" \
          TEST_FPM_TIMEOUT=120 \
          ./build/run-fpmng-phpt.sh "$PWD/build-out/prepared" "$PWD/fpmng-phpt-results"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fpmng-phpt-results
          path: fpmng-phpt-results
      - name: fail fast -- cancel the rest of the run (issue #209)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./build/ci-cancel-run.sh

  # Issue #97: ten of the .phpt tests this repo owns are gated on
  # --enable-fpmng-fiber, and no cell built with it -- so they could only ever
  # report SKIP. Reachable and unconditionally skipped is still untested:
  # nothing in CI would have noticed the fiber executor's request isolation,
  # its flock() interception, or the listening-flag normalisation across
  # reloads breaking, which is precisely the behaviour those tests exist for.
  #
  # This cell builds its own binary rather than reusing fpmng-canonical-build:
  # the flag changes the SAPI that gets compiled, so there is no artifact to
  # download. The default build keeps running the same suite in fpmng-phpt
  # above, so both sides of the flag stay covered -- which matters, because
  # the executor is chosen per pool and a stock binary does not contain this
  # code at all.
  #
  # --enable-fpmng-async is deliberately NOT set here: issue #87 records that
  # fpmng-config-rejected-directives.phpt can only pass with it off, so a cell
  # turning both on is a separate decision.
  #
  # Measured on the poligon, 2026-09-11, php-8.5.9, this exact configure line:
  # PASS=58, FAIL/ERROR=0, SKIP=0 of 58.
  fpmng-phpt-fiber:
    needs: patches
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/crazy-goat/php-fpm-ng-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # As root php-fpm refuses to start, so the suite would report PASS=0
      # with everything skipped and still look green. Same note as fpmng-phpt.
      options: --user 1001:1001
    env:
      # The CI image sets CCACHE_DIR=/ccache, which was a mount of the
      # self-hosted box's own disk. There is no such mount now, and / is not
      # writable by uid 1001, so the cache lives in the workspace -- which is
      # also the only place actions/cache can reach from inside a container job.
      # 900M rather than the image's 5G: the whole repository gets 10 GB of
      # cache and three jobs write one of these each, on every run.
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 900M
      # A directory and a cache prefix of its own: --enable-fpmng-fiber is a
      # different configure, so it cannot share objects with the default build.
      PHPSRC: ${{ github.workspace }}/php-src-fiber
    steps:
      - uses: actions/checkout@v7

      # What replaces the ccache directory the self-hosted runner kept on its
      # own disk. Restore only; the save is a separate step after the compile,
      # and runs on main alone. The restore-key is the prefix, so a run picks
      # up the newest entry for this job and this php-src pin, which on a
      # branch is always the one the last run on main wrote -- that is why this
      # workflow now also runs on push to main.
      - name: restore the compiler cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-fiber-${{ env.PHP_SRC_REF }}-${{ github.sha }}
          restore-keys: |
            ccache-fiber-${{ env.PHP_SRC_REF }}-

      # fpmng-http-direct-request-parity.phpt needs this locale to be
      # discriminating at all -- see the same step on fpmng-phpt (issue #105).
      - name: assert tr_TR.UTF-8 is present (issue #105)
        run: locale -a | grep -i tr_TR

      # Issue #196: one step in place of clone + prepare + buildconf + configure.
      # On a hosted runner there is never a tree to reuse, so what this buys
      # here is the four steps in one place; the compile behind it is what
      # ccache covers.
      - name: php-src build tree with the fiber executor
        env:
          CC: ccache gcc
          CXX: ccache g++
        run: |
          # $FPMNG_CONFIGURE_FLAGS and nothing else, plus the one flag this
          # cell is about, so the two builds cannot differ in anything else.
          # shellcheck disable=SC2086 -- the flag list is meant to word-split
          ( set +e; ./build/ci-build-tree.sh "$PHPSRC" "$PHP_SRC_REPO" "$PHP_SRC_REF" $FPMNG_CONFIGURE_FLAGS --enable-fpmng-fiber 2>&1; echo "$?" > tree-fiber.rc ) | tee tree-fiber.log
          exit "$(cat tree-fiber.rc)"

      - name: assert the fiber executor is really in this build
        # configure does not fail on an unknown --enable flag, it warns; so
        # assert the executor is actually in this build rather than trusting
        # the command line. Without this the whole cell could silently degrade
        # into a second copy of fpmng-phpt. The log is read from inside the
        # tree, where ci-build-tree.sh writes it, rather than from a step's own
        # stdout: the assertion then holds wherever configure ran.
        run: |
          grep -q "fiber-based multi-request executor in fpm-ng\.\.\. yes" "$PHPSRC/.fpmng-ci-configure.log"

      - name: build
        # Captures make's own status, not tee's; a build that failed would
        # otherwise reach the test step looking fine. See the longer note on
        # the `build` job for why this is not `set -o pipefail`.
        run: |
          # Issue #196: mark the tree unfinished for the duration of the build.
          # cancel-in-progress kills this step outright on every superseded
          # push, and a .o truncated by that kill keeps a fresh mtime, so make
          # would consider it current for good. ci-build-tree.sh starts over
          # when it finds this marker.
          touch "$PHPSRC/.fpmng-ci-dirty"
          ( set +e; make -C "$PHPSRC" -j"$(nproc)" fpmng cli 2>&1; echo "$?" > make-fiber.rc ) | tee make-fiber.log
          if [ "$(cat make-fiber.rc)" = 0 ]; then rm -f "$PHPSRC/.fpmng-ci-dirty"; fi
          exit "$(cat make-fiber.rc)"

      # Same as on the `build` job, and for the same reason: only main writes,
      # so a pull-request push cannot evict the entry it restores from.
      - name: save the compiler cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-fiber-${{ env.PHP_SRC_REF }}-${{ github.sha }}

      # Same as on the `build` job: the suite reads the payload out of the
      # binary it tests (issue #171), and this cell builds its own binary.
      - name: embed the distribution payload (issue #171)
        run: |
          chmod +x build/embed-payload.sh
          # FPMNG_ACME=1: the payload is the ACME client, and since issue #281
          # it is embedded only into a build that was configured for it --
          # which this one is, via FPMNG_CONFIGURE_FLAGS.
          FPMNG_ACME=1 ./build/embed-payload.sh "$PHPSRC/sapi/fpmng/php-fpm-ng" "$PHPSRC/sapi/cli/php"

      - name: run fpmng-owned .phpt tests on the fiber build
        run: |
          chmod +x build/run-fpmng-phpt.sh
          TEST_PHP_EXECUTABLE="$PHPSRC/sapi/cli/php" \
          TEST_PHP_FPM_EXECUTABLE="$PHPSRC/sapi/fpmng/php-fpm-ng" \
          TEST_FPM_TIMEOUT=120 \
          ./build/run-fpmng-phpt.sh "$PHPSRC" "$PWD/fpmng-phpt-fiber-results"

      # The green/red of the step above is not the acceptance criterion: a run
      # where all ten fiber tests SKIP passes it. See the script's header.
      - name: assert the fiber-gated tests actually ran (issue #97)
        run: |
          chmod +x build/assert-fiber-tests-ran.sh
          ./build/assert-fiber-tests-ran.sh "$PWD/fpmng-phpt-fiber-results"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fpmng-phpt-fiber-results
          path: fpmng-phpt-fiber-results
      - name: fail fast -- cancel the rest of the run (issue #209)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./build/ci-cancel-run.sh

  # Task 076 acceptance criterion ("the test is reachable from CI on at least
  # one job that has opcache, or... gains one; say which was done"): NO new
  # job was added. `ext/opcache/config.m4` calls
  # `PHP_NEW_EXTENSION([opcache], ..., [yes])` unconditionally -- there is no
  # `PHP_ARG_ENABLE([opcache])` guarding it at all in this php-src pin
  # ($PHP_SRC_REF) -- so opcache is compiled into every fpmng build regardless
  # of configure flags, `--enable-opcache`/`--disable-all` included, and
  # `opcache.enable` defaults to On. Measured directly: a from-scratch tree
  # configured with the exact `build` job's configure flags above (no opcache
  # flag at all) reports `Zend OPcache` loaded and `opcache.enable => On` via
  # `php -m`/`php -i`, and reproduces the task-076 SIGSEGV pre-fix. So the
  # existing `build` + `fpmng-phpt` cell above already has opcache active and
  # already runs every fpmng-*.phpt file, including the new
  # fpmng-http-direct-worker-opcache.phpt -- a second, --enable-opcache cell
  # would have built and run the identical thing. `static-musl` also has
  # opcache in (build/static-full.sh) but only smoke-tests a scratch
  # container, never the .phpt suite, so it doesn't cover this either way.

  # Task 013: clang-tidy over our C sources only (never a prepared php-src
  # tree's mixed upstream copies). It landed non-blocking on purpose -- a red
  # build on day one for pre-existing findings teaches people to ignore the
  # job. That backlog is now empty: issue #107 fixed the one real finding
  # (clang-analyzer-unix.Malloc in fpm_http.c) and issue #111 the remaining
  # two nits, so on 2026-09-09 `continue-on-error` was dropped and this job
  # became a required check. See docs/c-style.md for the enabled/disabled
  # check contract.
  #
  # Caveat, accepted knowingly, and narrowed since this job moved into
  # .github/docker/ci.Dockerfile: clang-tidy is whatever version that image's
  # base gives (LLVM 18.1.3 on ubuntu 24.04 today), so a new check can still
  # turn this job red without any change to our C sources. The fix then is a
  # decision about that check -- silence it in .clang-tidy with a reason, or
  # fix the code -- not restoring continue-on-error.
  #
  # Pinning the LLVM version was originally rejected as trading a rare, loud
  # break for a permanently stale checker. Pinning the base image is the same
  # trade only in part: the checker does go stale, but it moves on a reviewed
  # Dockerfile diff instead of on GitHub's runner-image schedule, so the break
  # lands in a PR that is already about the toolchain rather than on an
  # unrelated one.
  lint:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/crazy-goat/php-fpm-ng-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # uid 1001 is the `runner` account that owns the workspace on a hosted
      # image, so the container writes files the rest of the job can read. It
      # is also the only thing keeping this job off root, which the suites
      # depend on: as root php-fpm refuses to start, so a root job reports
      # PASS=0 with everything skipped and still looks green.
      options: --user 1001:1001
    env:
      # The CI image sets CCACHE_DIR=/ccache, which was a mount of the
      # self-hosted box's own disk and is not writable by uid 1001 here.
      # Nothing carries this directory anywhere -- see PHPSRC below for why
      # this job has no cache entry -- it just has to point somewhere writable
      # so configure's conftest compiles do not fail.
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      # The same configure line as `build`, so the tree this job configures is
      # the one clang-tidy's compile_commands.json has to describe. It shares
      # nothing else with that job: no cache entry of its own, because
      # build/lint-c.sh runs clang-tidy and never make, so all a ccache entry
      # here would ever hold is configure's conftest objects.
      PHPSRC: ${{ github.workspace }}/php-src-dynamic
    steps:
      - uses: actions/checkout@v7

      # Issue #196: one step in place of clone + prepare + buildconf + configure.
      # Headers only -- clang-tidy needs a configured tree, not a built one.
      - name: php-src build tree (headers only; no make)
        env:
          CC: ccache gcc
          CXX: ccache g++
        run: |
          # shellcheck disable=SC2086 -- the flag list is meant to word-split
          ( set +e; ./build/ci-build-tree.sh "$PHPSRC" "$PHP_SRC_REPO" "$PHP_SRC_REF" $FPMNG_CONFIGURE_FLAGS 2>&1; echo "$?" > tree-lint.rc ) | tee tree-lint.log
          exit "$(cat tree-lint.rc)"

      - name: clang-tidy report (our files only)
        run: |
          chmod +x build/lint-c.sh
          ./build/lint-c.sh "$PHPSRC" 2>&1 | tee lint-c-report.txt

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lint-c-report
          path: lint-c-report.txt
          retention-days: 14
      - name: fail fast -- cancel the rest of the run (issue #209)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./build/ci-cancel-run.sh

  # Task 004: prove that the shipped SAPI, not the historical php-src HTTP POC,
  # links statically on musl and serves HTTP when it is the only executable in
  # a scratch image.
  static-musl:
    runs-on: ubuntu-latest
    env:
      # This job is not containerised -- it drives `docker run` with host bind
      # mounts, which the host daemon resolves -- so it names a host path.
      # Inside the workspace, not beside it: actions/cache rejects any path
      # containing `..` with `Invalid pattern ... Relative pathing '.' and
      # '..' is not allowed`, and does so as a *warning* -- the step stays
      # green and saves nothing. Measured on run 34702558731, where this
      # directory was `$GITHUB_WORKSPACE/../buildtree-musl` and the cache was
      # inert in both directions.
      #
      # Spelled with the github context rather than `${{ runner.temp }}`: the
      # runner context does not exist in a job-level env: and naming it there
      # fails the whole workflow at startup, which is how the first run of this
      # change ended. The two reclaim-from-root steps that used to stand here
      # are gone with the box that needed them -- a hosted runner hands the
      # next job a new machine, not the workspace this one left root-owned.
      MUSL_CACHE: ${{ github.workspace }}/buildtree-musl
    steps:
      - uses: actions/checkout@v7

      # Issue #197: the same tree the container jobs get from
      # ci-build-tree.sh, minus configure -- the musl toolchain that has to
      # run it only exists inside the Alpine container below, which
      # configures out of tree and keeps its own key next to /build.
      - name: php-src tree for the static build
        env:
          FPMNG_TREE_SKIP_CONFIGURE: "yes"
        run: |
          ( set +e; ./build/ci-build-tree.sh "$MUSL_CACHE/src" "$PHP_SRC_REPO" "$PHP_SRC_REF" 2>&1; echo "$?" > tree-musl.rc ) | tee tree-musl.log
          exit "$(cat tree-musl.rc)"

      # The Alpine container below writes its ccache and its downloaded .apk
      # files into these two host directories. On the self-hosted box they
      # simply stayed there; here they have to be carried between runs. What
      # this is worth is 318 s -> 107 s for this job, measured on runs
      # 34702558731 and 34703566697; the figure from the poligon era, 456 s
      # with no cache of any kind, was run 34594056547.
      # /build is deliberately not cached -- it is object files for a configure
      # that runs inside the container, and ccache already covers the compile.
      - name: restore the musl compiler and package caches
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ github.workspace }}/buildtree-musl/ccache
            ${{ github.workspace }}/buildtree-musl/apk
          key: musl-${{ env.PHP_SRC_REF }}-${{ github.sha }}
          restore-keys: |
            musl-${{ env.PHP_SRC_REF }}-

      - name: build static php-fpm-ng on Alpine
        # /build, /ccache and the apk cache are host directories. They survive
        # the run only through the actions/cache step above; /build does not,
        # and is here because static-full.sh configures out of tree. This was
        # the only compiling job in the matrix with no compiler cache at all
        # and a full 25-package apk install every time -- see the cache step
        # above for what fixing that was worth.
        run: |
          mkdir -p "$MUSL_CACHE/build" "$MUSL_CACHE/ccache" "$MUSL_CACHE/apk" out-static
          docker run --rm \
            -v "$MUSL_CACHE/src:/src" \
            -v "$MUSL_CACHE/build:/build" \
            -v "$MUSL_CACHE/ccache:/ccache" \
            -v "$MUSL_CACHE/apk:/etc/apk/cache" \
            -v "$PWD:/repo" \
            -v "$PWD/out-static:/out" \
            alpine:3.22 sh /repo/build/static-full.sh
      # The container above ran as root and so these are root-owned, while the
      # save below runs as the runner account. A cache save that cannot read
      # its path only warns, so without this the entry would never be written
      # and nothing would say so.
      - name: hand the musl caches back to the runner account
        if: github.ref == 'refs/heads/main'
        run: sudo chown -R "$(id -u):$(id -g)" "$MUSL_CACHE/ccache" "$MUSL_CACHE/apk"

      - name: save the musl compiler and package caches
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ github.workspace }}/buildtree-musl/ccache
            ${{ github.workspace }}/buildtree-musl/apk
          key: musl-${{ env.PHP_SRC_REF }}-${{ github.sha }}

      - name: verify static binary in a scratch image
        run: ./build/test-static-full.sh "$PWD/out-static/php-fpm-ng-full"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: static-musl-logs
          path: |
            out-static/configure-full.log
            out-static/make-full.log
          retention-days: 14
      - name: fail fast -- cancel the rest of the run (issue #209)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./build/ci-cancel-run.sh

  # Task 010: the HTTP gateway must drop root before it ever accepts a
  # connection, instead of holding the master's identity (and the TLS private
  # key) for its whole life. Needs to run as root, which the phpt job's
  # runner isn't by default -- kept as its own job for that reason, not
  # folded into phpt.
  gateway-privileges:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/crazy-goat/php-fpm-ng-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # No --user here, unlike every other job: this one asserts the gateway
      # drops root before accepting a connection, so it has to start with it.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: fpmng-canonical-build
          path: build-out
      - name: verify the gateway drops privileges (task 010)
        run: |
          chmod +x build-out/bin/php-fpm-ng
          ./build/test-http-gateway-privileges.sh "$PWD/build-out/bin/php-fpm-ng"
      - name: fail fast -- cancel the rest of the run (issue #209)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./build/ci-cancel-run.sh

  # Task 040: a renewed TLS certificate must take effect in every gateway
  # process without a restart. Needs multiple real gateway processes under
  # SO_REUSEPORT, a load generator running across the file swap, and a
  # deliberately broken candidate -- a shell-driven scenario like
  # gateway-privileges above, but no root needed (nothing here drops
  # privileges), so it stays out of the phpt job rather than needing sudo.
  tls-reload:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/crazy-goat/php-fpm-ng-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # uid 1001 is the `runner` account that owns the workspace on a hosted
      # image, so the container writes files the rest of the job can read. It
      # is also the only thing keeping this job off root, which the suites
      # depend on: as root php-fpm refuses to start, so a root job reports
      # PASS=0 with everything skipped and still looks green.
      options: --user 1001:1001
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: fpmng-canonical-build
          path: build-out
      - name: verify TLS certificate reload without restart (task 040)
        run: |
          chmod +x build-out/bin/php-fpm-ng
          ./build/test-http-tls-reload.sh "$PWD/build-out/bin/php-fpm-ng"
      - name: fail fast -- cancel the rest of the run (issue #209)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./build/ci-cancel-run.sh

  # Issue #172: a pool with http.tls_wait_for_cert must start without its
  # certificate, refuse TLS connections rather than answer them badly, and
  # have every gateway process pick up the certificate once it appears. The
  # load-bearing part is a socket that is bound but not listening, which no
  # phpt can observe -- it shows up only as the difference between curl exit
  # 7 (refused) and 35 (handshake failed). Same shape and same non-root
  # requirement as tls-reload above, its own job so a failure here is not
  # read as a reload failure.
  tls-wait-for-cert:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/crazy-goat/php-fpm-ng-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # As root php-fpm refuses to start and the suite would report success
      # without having tested anything. See the same note on tls-reload.
      options: --user 1001:1001
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: fpmng-canonical-build
          path: build-out
      - name: verify the NO_CERT -> READY transition (issue #172)
        run: |
          chmod +x build-out/bin/php-fpm-ng
          ./build/test-http-tls-wait-for-cert.sh "$PWD/build-out/bin/php-fpm-ng"
      - name: fail fast -- cancel the rest of the run (issue #209)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./build/ci-cancel-run.sh

  # Issue #90: the per-connection read deadline (task 031) used to fire into a
  # bufferevent evhttp had already freed, killing the whole gateway process
  # with SIGSEGV. Same shape as tls-reload above -- real gateway processes,
  # real TLS, no root -- and its own job so a crash here is not read as a
  # reload failure.
  read-deadline:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/crazy-goat/php-fpm-ng-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # uid 1001 is the `runner` account that owns the workspace on a hosted
      # image, so the container writes files the rest of the job can read. It
      # is also the only thing keeping this job off root, which the suites
      # depend on: as root php-fpm refuses to start, so a root job reports
      # PASS=0 with everything skipped and still looks green.
      options: --user 1001:1001
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: fpmng-canonical-build
          path: build-out
      - name: verify a gateway survives its own read deadline (issue #90)
        run: |
          chmod +x build-out/bin/php-fpm-ng
          ./build/test-http-read-deadline.sh "$PWD/build-out/bin/php-fpm-ng"
      - name: fail fast -- cancel the rest of the run (issue #209)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./build/ci-cancel-run.sh

  # Issue #129: a synchronous hard write error while handing a request to an
  # upstream freed the connection and the upstream underneath their caller.
  # Nothing observable from outside the process changes -- the gateway answers
  # 502 and keeps serving on a corrupted heap -- so this cell runs the gateway
  # under valgrind and fails on any invalid access inside fpm_http.c. Own job
  # for the same reason as read-deadline above: memcheck makes it slow, and a
  # failure here means one specific thing.
  gateway-write-failure:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/crazy-goat/php-fpm-ng-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # uid 1001 is the `runner` account that owns the workspace on a hosted
      # image, so the container writes files the rest of the job can read. It
      # is also the only thing keeping this job off root, which the suites
      # depend on: as root php-fpm refuses to start, so a root job reports
      # PASS=0 with everything skipped and still looks green.
      options: --user 1001:1001
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: fpmng-canonical-build
          path: build-out
      - name: verify a synchronous upstream write failure corrupts nothing (issue #129)
        run: |
          chmod +x build-out/bin/php-fpm-ng
          ./build/test-http-gateway-write-failure.sh "$PWD/build-out/bin/php-fpm-ng"
      - name: fail fast -- cancel the rest of the run (issue #209)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./build/ci-cancel-run.sh

  plain-http-listener:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/crazy-goat/php-fpm-ng-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # uid 1001 is the `runner` account that owns the workspace on a hosted
      # image, so the container writes files the rest of the job can read. It
      # is also the only thing keeping this job off root, which the suites
      # depend on: as root php-fpm refuses to start, so a root job reports
      # PASS=0 with everything skipped and still looks green.
      options: --user 1001:1001
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: fpmng-canonical-build
          path: build-out
      - name: verify the redirect-only plain HTTP companion (task 042)
        run: |
          chmod +x build-out/bin/php-fpm-ng
          ./build/test-http-plain-listener.sh "$PWD/build-out/bin/php-fpm-ng"
      - name: fail fast -- cancel the rest of the run (issue #209)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./build/ci-cancel-run.sh

  # Issue #224: gate the artefact a user installs, not the tree it was built
  # from. Every other cell here runs a binary out of a build directory; this one
  # builds the .deb and the .apk, throws the build host away, installs each
  # package into a container with no compiler in it, and runs the owned suite
  # against the installed binary. The file layout, the conffiles, the dependency
  # on the distribution's embed package and issue #220's refusal to run against
  # another minor's libphp have no other coverage.
  #
  # Gating, not informational (which is where #217 left it): once this build is
  # what users install, a regression that only CI could have caught would
  # otherwise ship and be found by a user. That is also why #217 asked for a
  # second, non-gating cell doing the same build and closed without one -- it
  # would have been this job with its verdict thrown away.
  #
  # HOW TO READ A FAILURE HERE (issue #217). This is the one cell that links
  # against a PHP nobody in this repository pinned: 8.5.4 from Ubuntu and
  # 8.5.10 from Alpine, against the php-8.5.9 the rest of the matrix builds.
  # So a red here that no other cell shows is a question before it is a
  # verdict, and the first thing to check is the version line the job prints
  # ("libphp-build.sh: php-config8.5 -> PHP x.y.z"). A distribution moving its
  # minor, dropping a symbol, or changing what its php_config.h claims about
  # the build host all land here and nowhere else. It still blocks the merge,
  # because the packages are what users install and shipping a package this
  # cell cannot install is worse than waiting -- but the fix may well be in
  # this repository's expectations rather than in the change under review.
  #
  # Not containerised, like static-musl and for the same reason: the script
  # drives `docker run` with host bind mounts, and -v paths are resolved by the
  # host daemon, so a containerised copy of it would mount empty directories.
  #
  # Both flavours in one job rather than two: they share the prepared tree set
  # up below, and on a hosted runner two jobs would each clone and patch
  # php-src again to split a step that costs less than that.
  #
  # WHERE THE TIME GOES (issue #240). Timed on the box, the deb flavour was 328
  # seconds, of which 232 were `apt-get` unpacking the distribution's PHP -- our
  # own build and package step was 16 and the 61-test suite was 72. Not the
  # network: downloading those packages took 6 seconds and dpkg took 66. So
  # build/ci-package-gate.sh now runs its two stages in images ci-image.yml
  # pre-installs that set into, and does the unpacking nightly instead of four
  # times per pull request. The images are a cache, not a contract: the stages
  # still name every package they need, and against a bare base image they
  # install it exactly as before.
  package-gate:
    needs: patches
    runs-on: ubuntu-latest
    env:
      # A host path the runner user owns, for the same reason static-musl
      # names one, and named without the runner context, which a job-level
      # env: does not have. Nothing caches it, so unlike MUSL_CACHE it may sit
      # outside the workspace. The reclaim-from-root steps that used to precede
      # the checkout are gone with the shared box -- nothing outside this run
      # will ever try to unlink what the containers below write as root.
      PACKAGE_CACHE: ${{ github.workspace }}/../buildtree-package
      # Refuse the bare-base-image fallback. See the login step below.
      FPMNG_REQUIRE_WARM_IMAGES: "1"
    steps:
      - uses: actions/checkout@v7

      # This job is not containerised, so nothing has authenticated its docker
      # daemon to ghcr -- and the package-gate images are private. Without this
      # the pull in ci-package-gate.sh fails and the script falls back to
      # building both stages from a bare base image: the job goes back to the
      # 328 seconds issue #240 removed, and still passes. Which is why
      # FPMNG_REQUIRE_WARM_IMAGES is set below -- in CI that fallback is a
      # failure, not a slow path.
      - name: log in to ghcr.io for the package-gate images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

      # The tree is needed for its sources and its tests, never for a build
      # product: build/libphp-build.sh compiles the 54 sources config.m4 names
      # against the distribution's headers, inside the container. Hence
      # FPMNG_TREE_SKIP_CONFIGURE -- there is no configure on this path at all.
      - name: php-src tree for the package build
        env:
          FPMNG_TREE_SKIP_CONFIGURE: "yes"
        run: |
          ( set +e; ./build/ci-build-tree.sh "$PACKAGE_CACHE/src" "$PHP_SRC_REPO" "$PHP_SRC_REF" 2>&1; echo "$?" > tree-package.rc ) | tee tree-package.log
          exit "$(cat tree-package.rc)"

      - name: the .deb, installed on a machine with no compiler
        run: ./build/ci-package-gate.sh deb "$PACKAGE_CACHE/src" "$PWD/out-package-deb"
      - name: the .apk, installed on a machine with no compiler
        run: ./build/ci-package-gate.sh apk "$PACKAGE_CACHE/src" "$PWD/out-package-apk"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: package-gate-results
          path: |
            out-package-deb/results
            out-package-apk/results
          retention-days: 14
      - name: fail fast -- cancel the rest of the run (issue #209)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./build/ci-cancel-run.sh
