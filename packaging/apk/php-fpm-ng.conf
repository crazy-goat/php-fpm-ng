; php-fpm-ng master configuration, as shipped by the .apk.
;
; This binary is dynamically linked against the distribution's libphp
; (php85-embed, /usr/lib/php85/libphp.so, which the binary finds through an
; RPATH because Alpine keeps it off the default library path). That is the
; whole point of the package -- nothing is compiled on your machine -- and it
; is also why two pool types are missing from this file. See conf.d/www.conf.

[global]
error_log = /var/log/php-fpm-ng/error.log

; OpenRC runs the master in the foreground under supervise-daemon; see
; /etc/init.d/php-fpm-ng.
daemonize = no

include=/etc/php-fpm-ng/conf.d/*.conf
