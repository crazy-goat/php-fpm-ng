; The pool the package ships, so that an install is immediately runnable.
;
; pool.type = fastcgi is classic FPM: a web server (nginx, Apache, Caddy)
; speaks FastCGI to the socket below. Change it to http-direct to have this
; process serve HTTP itself, with no web server in front:
;
;   pool.type = http-direct
;   listen = 0.0.0.0:8080
;   chdir = /var/www/html
;   http.front_controller = /index.php
;
; Those two are the only types this package supports, and the binary refuses
; the others at startup rather than running them under a name that promises
; something it cannot deliver. pool.type = fastcgi-ng and pool.type = http need
; a patch inside Zend/ (patches/0006, persistent signal handlers); a
; distribution libphp is built from unpatched php-src and does not carry it.
; To run those, build from source with build/static-full.sh.

[www]
pool.type = fastcgi

user = nobody
group = nobody

listen = /run/php-fpm-ng/www.sock
listen.owner = nobody
listen.group = nobody
listen.mode = 0660

pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
