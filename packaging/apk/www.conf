; The pool the package ships, so that an install is immediately runnable.
;
; pool.type = fastcgi is classic FPM: a web server (nginx, Apache, Caddy)
; speaks FastCGI to the socket below. Change it to http-direct to have this
; process serve HTTP itself, with no web server in front:
;
;   pool.type = http-direct
;   listen = 0.0.0.0:8080
;   chdir = /var/www/html
;   http.front_controller = /index.php
;
; pool.type = gateway is the built-in HTTP proxy (issue #388): it terminates
; HTTP(S) itself and routes path prefixes to the pools behind it, with no web
; server in front. It needs at least one http.route[] entry:
;
;   [gateway]
;   pool.type = gateway
;   listen = 0.0.0.0:8080
;   chdir = /var/www/html
;   http.route[www] = /
;
; Those three are the types this package supports. A distribution libphp is
; built from unpatched php-src, so a pool type whose children need a patch of
; ours would be refused at startup rather than run under a name that promises
; something it cannot deliver; none needs one today.

[www]
pool.type = fastcgi

user = nobody
group = nobody

listen = /run/php-fpm-ng/www.sock
listen.owner = nobody
listen.group = nobody
listen.mode = 0660

pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
