# Private MySQL/Redis for SERVICE_MODE=docker (see bin/run.sh). Versions are
# pinned to match tests/frameworks/symfony/compose.yaml so a framework-to-
# framework comparison is not confounded by a service-version difference.
services:
  mysql:
    image: mysql:8.4.6
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-fpmng-laravel-root}
    ports:
      - "${MYSQL_PORT:-13307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports:
      - "${REDIS_PORT:-16380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  mysql-data:
